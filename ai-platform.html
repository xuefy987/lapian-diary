<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>AI短片创作</title>
<style>
  :root {
    --bg: #f5f6f8;
    --bg2: #ffffff;
    --bg3: #f0f2f5;
    --ink: #1a1a2e;
    --muted: #6b7280;
    --rule: #e5e7eb;
    --accent: #4f46e5;
    --accent2: #06b6d4;
    --success: #10b981;
    --danger: #ef4444;
    --warning: #f59e0b;
    --glass: rgba(255, 255, 255, 0.75);
    --input-bg: #ffffff;
    --shadow: 0 1px 3px rgba(0,0,0,0.06);
    --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { touch-action: manipulation; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
    background: var(--bg); color: var(--ink);
    min-height: 100vh; min-height: 100dvh; line-height: 1.6;
  }
  button, [onclick], .btn { touch-action: manipulation; cursor: pointer; -webkit-tap-highlight-color: transparent; font-family: inherit; }

  .app { display: flex; min-height: 100vh; min-height: 100dvh; }

  /* ====== LEFT SIDEBAR ====== */
  .sidebar {
    width: 260px; flex-shrink: 0;
    background: var(--glass); backdrop-filter: blur(8px);
    border-right: 1px solid var(--rule);
    display: flex; flex-direction: column;
    position: sticky; top: 0; height: 100vh; height: 100dvh; overflow-y: auto;
  }
  .sidebar-header { padding: 20px 18px 16px; border-bottom: 1px solid var(--rule); }
  .sidebar-header h1 {
    font-size: 1.15rem; font-weight: 700; margin-bottom: 4px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .sidebar-header .subtitle { font-size: 0.7rem; color: var(--muted); }
  .project-name-section { padding: 16px 18px; border-bottom: 1px solid var(--rule); }
  .project-name-section label {
    font-size: 0.72rem; color: var(--muted); font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.05em; display: block; margin-bottom: 6px;
  }
  .project-name-input {
    background: var(--input-bg); border: 1px solid var(--rule);
    border-radius: 8px; padding: 8px 12px; color: var(--ink);
    font-size: 0.85rem; font-family: inherit; width: 100%;
  }
  .project-name-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px rgba(79,70,229,0.12); }
  .sidebar-actions { padding: 14px 18px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--rule); }
  .sidebar-actions .btn { width: 100%; justify-content: center; }
  .sidebar-actions .row { display: flex; gap: 6px; }
  .sidebar-actions .row .btn { flex: 1; }
  .sidebar-cloud-section { padding: 14px 18px; border-bottom: 1px solid var(--rule); }
  .sidebar-cloud-section .row { display: flex; gap: 6px; }
  .sidebar-cloud-section .row .btn { flex: 1; }
  .cloud-status { font-size: 11px; color: var(--muted); margin-top: 6px; text-align: center; min-height: 14px; }
  .sidebar-projects { padding: 14px 18px; flex: 1; overflow-y: auto; }
  .sidebar-projects-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .sidebar-projects-header h3 { font-size: 0.78rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .pm-count-badge { font-size: 0.68rem; color: var(--accent); background: rgba(79,70,229,0.1); padding: 2px 8px; border-radius: 6px; }
  .pm-list { display: flex; flex-direction: column; gap: 6px; }
  .pm-empty { font-size: 0.75rem; color: var(--muted); text-align: center; padding: 12px; }
  .pm-item { border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; background: var(--bg2); }
  .pm-item.active { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(79,70,229,0.1); }
  .pm-item-header { display: flex; align-items: center; gap: 6px; padding: 8px 10px; }
  .pm-item-name { font-size: 0.8rem; font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pm-item-meta { font-size: 0.68rem; color: var(--muted); margin-bottom: 6px; }
  .pm-item-actions { display: flex; gap: 6px; }
  .pm-icon-btn { font-size: 0.7rem; padding: 3px 8px; border: 1px solid var(--rule); border-radius: 6px; background: var(--bg3); color: var(--ink); }
  .pm-icon-btn.danger { color: var(--danger); border-color: rgba(239,68,68,0.3); }
  .pm-item-body { padding: 0 10px 10px; display: none; }
  .pm-item.expanded .pm-item-body { display: block; }

  /* ====== RIGHT MAIN ====== */
  .main-panel { flex: 1; padding: 20px 24px; overflow-x: hidden; min-width: 0; }
  .section-card { background: var(--bg2); border: 1px solid var(--rule); border-radius: 12px; padding: 18px; margin-bottom: 16px; box-shadow: var(--shadow); }
  .section-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }
  .section-title { font-size: 0.98rem; font-weight: 700; color: var(--accent); display: flex; align-items: center; gap: 8px; }
  .section-title.small { font-size: 0.88rem; color: var(--accent2); margin-top: 14px; }
  .section-desc { font-size: 0.76rem; color: var(--muted); margin-bottom: 12px; }
  .btn-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 5px; border: 1px solid transparent; border-radius: 8px; padding: 8px 14px; font-size: 0.82rem; font-weight: 600; transition: all 0.15s; }
  .btn-sm { padding: 6px 11px; font-size: 0.76rem; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-secondary { background: var(--bg3); color: var(--ink); border-color: var(--rule); }
  .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
  .btn-success { background: var(--success); color: #fff; }
  .btn:disabled { opacity: 0.55; cursor: not-allowed; }

  .script-area {
    width: 100%; min-height: 220px; resize: vertical; padding: 12px;
    border: 1px solid var(--rule); border-radius: 10px; background: var(--input-bg);
    color: var(--ink); font-size: 0.85rem; font-family: inherit; line-height: 1.7; outline: none;
  }
  .script-area:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(79,70,229,0.1); }
  .script-meta { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 10px; font-size: 0.72rem; color: var(--muted); }
  .meta-label { color: var(--accent); font-weight: 600; }

  /* Reference image grid */
  .ref-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-top: 10px; }
  .ref-empty { grid-column: 1/-1; text-align: center; color: var(--muted); font-size: 0.78rem; padding: 20px; border: 1px dashed var(--rule); border-radius: 10px; }
  .ref-card { border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; background: var(--bg3); display: flex; flex-direction: column; }
  .ref-thumb { position: relative; width: 100%; aspect-ratio: 3/4; background: var(--bg3); display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; }
  .ref-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ref-thumb .ref-placeholder { font-size: 0.72rem; color: var(--muted); text-align: center; padding: 10px; }
  .ref-thumb .ref-badge { position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,0.55); color: #fff; font-size: 0.62rem; padding: 2px 6px; border-radius: 6px; }
  .ref-name { width: 100%; border: none; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); background: var(--bg2); color: var(--ink); font-size: 0.76rem; padding: 6px 8px; outline: none; font-family: inherit; }
  .ref-name:focus { background: var(--bg3); }
  .ref-actions { display: flex; }
  .ref-actions button { flex: 1; border: none; background: var(--bg2); color: var(--muted); font-size: 0.72rem; padding: 6px; cursor: pointer; }
  .ref-actions button:hover { background: var(--bg3); color: var(--accent); }
  .ref-actions button.danger:hover { color: var(--danger); }

  /* Phrases */
  .phrase-add { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 12px; }
  .phrase-input { flex: 1; min-height: 42px; max-height: 120px; resize: vertical; padding: 9px 11px; border: 1px solid var(--rule); border-radius: 8px; background: var(--input-bg); color: var(--ink); font-size: 0.82rem; font-family: inherit; outline: none; }
  .phrase-input:focus { border-color: var(--accent); }
  .phrase-list { display: flex; flex-direction: column; gap: 8px; }
  .phrase-empty { text-align: center; color: var(--muted); font-size: 0.78rem; padding: 18px; border: 1px dashed var(--rule); border-radius: 10px; }
  .phrase-item { display: flex; align-items: flex-start; gap: 8px; border: 1px solid var(--rule); border-radius: 8px; padding: 9px 11px; background: var(--bg3); }
  .phrase-text { flex: 1; font-size: 0.82rem; color: var(--ink); white-space: pre-wrap; word-break: break-word; }
  .phrase-tools { display: flex; gap: 4px; flex-shrink: 0; }
  .phrase-tools button { border: 1px solid var(--rule); background: var(--bg2); border-radius: 6px; font-size: 0.68rem; padding: 3px 7px; color: var(--muted); }
  .phrase-tools button:hover { color: var(--accent); border-color: var(--accent); }
  .phrase-tools button.danger:hover { color: var(--danger); border-color: var(--danger); }

  /* Modal */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 16px; }
  .modal-overlay.show { display: flex; }
  .modal { background: var(--bg2); border-radius: 14px; padding: 22px; max-width: 420px; width: 100%; box-shadow: var(--shadow-lg); }
  .modal-msg { font-size: 0.86rem; color: var(--ink); white-space: pre-wrap; margin-bottom: 18px; }
  .modal-btns { display: flex; gap: 8px; justify-content: flex-end; }

  /* Toast */
  .toast { position: fixed; left: 50%; bottom: 32px; transform: translate(-50%, 20px); background: rgba(20,22,34,0.94); color: #fff; padding: 10px 18px; border-radius: 10px; font-size: 0.82rem; opacity: 0; pointer-events: none; transition: all 0.28s; z-index: 10000; max-width: 80%; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 760px) {
    .app { flex-direction: column; }
    .sidebar { width: 100%; height: auto; position: relative; }
    .main-panel { padding: 14px; }
    .ref-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
  }
</style>
</head>
<body>

<div class="app">
  <!-- ====== SIDEBAR ====== -->
  <aside class="sidebar" id="aiSidebar">
    <div class="sidebar-header">
      <h1>AI短片创作</h1>
      <div class="subtitle">剧本 · 参考图 · 常用语句</div>
    </div>

    <div class="project-name-section">
      <label>作品名称</label>
      <input type="text" class="project-name-input" id="projectName" placeholder="输入作品名称..." value="未命名作品">
    </div>

    <div class="sidebar-actions">
      <button class="btn btn-primary btn-sm" onclick="saveProject()">💾 保存作品</button>
      <div class="row">
        <button class="btn btn-secondary btn-sm" onclick="newProject()">➕ 新建</button>
        <button class="btn btn-secondary btn-sm" onclick="document.getElementById('importFile').click()">📥 导入</button>
      </div>
      <button class="btn btn-secondary btn-sm" onclick="exportProject()">📤 导出备份 JSON</button>
      <button class="btn btn-secondary btn-sm" onclick="pickFolderAndSave()">📁 保存到文件夹</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importProject(event)">
    </div>

    <div class="sidebar-cloud-section">
      <div class="row">
        <button class="btn btn-primary btn-sm" onclick="aiCloudBackup()" id="aiCloudBackupBtn">☁️ 云端备份</button>
        <button class="btn btn-secondary btn-sm" onclick="aiCloudRestore()" id="aiCloudRestoreBtn">⬇️ 云端恢复</button>
      </div>
      <div class="cloud-status" id="aiCloudStatus"></div>
    </div>

    <div class="sidebar-projects">
      <div class="sidebar-projects-header">
        <h3>我的作品</h3>
        <span class="pm-count-badge" id="pmCount">0</span>
      </div>
      <div class="pm-list" id="pmList"></div>
    </div>
  </aside>

  <!-- ====== MAIN ====== -->
  <main class="main-panel">
    <!-- 剧本 -->
    <section class="section-card">
      <div class="section-head">
        <div class="section-title">📝 剧本</div>
        <div class="btn-bar" style="margin:0;">
          <button class="btn btn-secondary btn-sm" onclick="document.getElementById('scriptUpload').click()">📢 上传剧本</button>
          <button class="btn btn-secondary btn-sm" onclick="exportScript()">⤓ 导出剧本</button>
          <button class="btn btn-secondary btn-sm" onclick="clearScript()">🗑 清空</button>
        </div>
      </div>
      <div class="section-desc">上传或粘贴剧本（支持 .txt / .md / .docx / .json / .csv），保存后随作品一同备份。</div>
      <input type="file" id="scriptUpload" accept=".txt,.md,.markdown,.docx,.json,.csv" style="display:none" onchange="handleScriptUpload(event)">
      <textarea id="scriptInput" class="script-area" placeholder="在此粘贴剧本内容...&#10;也可点击上方「上传剧本」按钮导入文件"></textarea>
      <div id="scriptMeta" class="script-meta" style="display:none;"></div>
    </section>

    <!-- 角色参考图 -->
    <section class="section-card">
      <div class="section-head">
        <div class="section-title">👤 角色参考图</div>
        <div class="btn-bar" style="margin:0;">
          <button class="btn btn-primary btn-sm" onclick="addRef('char')">➕ 新增角色</button>
        </div>
      </div>
      <div class="section-desc">上传角色参考图，保存后随作品一同备份。</div>
      <div class="ref-grid" id="charGrid"></div>
    </section>

    <!-- 场景 + 道具参考图 -->
    <section class="section-card">
      <div class="section-head">
        <div class="section-title">🌄 场景参考图</div>
        <div class="btn-bar" style="margin:0;">
          <button class="btn btn-primary btn-sm" onclick="addRef('scene')">➕ 新增场景</button>
        </div>
      </div>
      <div class="ref-grid" id="sceneGrid"></div>

      <div class="section-head" style="margin-top:18px;">
        <div class="section-title small">🎬 道具参考图</div>
        <div class="btn-bar" style="margin:0;">
          <button class="btn btn-primary btn-sm" onclick="addRef('prop')">➕ 新增道具</button>
        </div>
      </div>
      <div class="ref-grid" id="propGrid"></div>
    </section>

    <!-- 常用语句 -->
    <section class="section-card">
      <div class="section-head">
        <div class="section-title">💬 常用语句</div>
      </div>
      <div class="section-desc">保存常用语句，方便复用；可一键复制或插入到剧本。</div>
      <div class="phrase-add">
        <textarea id="phraseInput" class="phrase-input" placeholder="输入常用语句..."></textarea>
        <button class="btn btn-primary btn-sm" onclick="addPhrase()">💾 保存语句</button>
      </div>
      <div class="phrase-list" id="phraseList"></div>
    </section>
  </main>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-msg" id="modalMsg"></div>
    <div class="modal-btns" id="modalBtns"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ==================== 常量 ====================
var STORAGE_KEY = 'ai_drama_projects';     // 与平台云备份保持一致
var PHRASES_KEY = 'ai_common_phrases';
var CURRENT_KEY = 'ai_current_project';
var THEME_KEY = 'xfy_theme_mode';
var CLOUD_TOKEN_KEY = 'xfy_github_token';
var CLOUD_REPO = 'xuefy987/lapian-diary';
var CLOUD_FILE = 'cloud-backup.json';

var REF_TYPES = {
  char:  { arr: 'characters', label: '角色', grid: 'charGrid' },
  scene: { arr: 'scenes',     label: '场景', grid: 'sceneGrid' },
  prop:  { arr: 'props',      label: '道具', grid: 'propGrid' }
};

// ==================== 状态 ====================
var project = null;
var phrases = [];          // 常用语句（全局库）
var autoSaveTimer = null;

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function clone(o) { return JSON.parse(JSON.stringify(o)); }
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function emptyProject(name) {
  return {
    name: name || '未命名作品',
    script: '',
    characters: [],
    scenes: [],
    props: [],
    createdAt: Date.now(),
    updatedAt: Date.now()
  };
}

// ==================== 本地存储 ====================
function getStoredProjects() {
  try { var raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : []; }
  catch(e) { return []; }
}
function setStoredProjects(list) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
  try { window.parent.postMessage({ type: 'dataChanged' }, '*'); } catch(e) {}
}

function persistProject(silent) {
  var list = getStoredProjects();
  var idx = -1;
  for (var i = 0; i < list.length; i++) { if (list[i].name === project.name) { idx = i; break; } }
  if (idx >= 0) list[idx] = clone(project); else list.push(clone(project));
  try {
    setStoredProjects(list);
    localStorage.setItem(CURRENT_KEY, project.name);
    renderProjectList();
    if (!silent) showToast('作品「' + project.name + '」已保存');
    return true;
  } catch(e) {
    showToast('保存失败：存储空间不足，请导出备份或减少参考图');
    return false;
  }
}

// 将旧格式项目迁移为新格式（保留已有参考图）
function migrateProject(p) {
  p = p || {};
  var migrated = emptyProject(p.name || '未命名作品');
  migrated.script = p.script || '';
  migrated.createdAt = p.createdAt || Date.now();
  migrated.updatedAt = p.updatedAt || Date.now();

  // 角色：旧数据可能是 characters 数组 + characterLibrary 映射
  if (Array.isArray(p.characters)) {
    p.characters.forEach(function(c) {
      var img = c.image || '';
      if (!img && p.characterLibrary && p.characterLibrary[c.name]) img = p.characterLibrary[c.name];
      migrated.characters.push({ id: uid(), name: c.name || '未命名角色', image: img || '' });
    });
  } else if (p.characterLibrary) {
    Object.keys(p.characterLibrary).forEach(function(name) {
      migrated.characters.push({ id: uid(), name: name, image: p.characterLibrary[name] || '' });
    });
  }

  // 场景
  if (Array.isArray(p.scenes)) {
    p.scenes.forEach(function(s) {
      var img = s.image || '';
      if (!img && p.sceneLibrary && p.sceneLibrary[s.name]) img = p.sceneLibrary[s.name];
      migrated.scenes.push({ id: uid(), name: s.name || '未命名场景', image: img || '' });
    });
  } else if (p.sceneLibrary) {
    Object.keys(p.sceneLibrary).forEach(function(name) {
      migrated.scenes.push({ id: uid(), name: name, image: p.sceneLibrary[name] || '' });
    });
  }

  // 道具（新字段，旧数据一般没有）
  if (Array.isArray(p.props)) {
    p.props.forEach(function(pr) {
      migrated.props.push({ id: uid(), name: pr.name || '未命名道具', image: pr.image || '' });
    });
  }

  return migrated;
}

// ==================== 作品管理 ====================
function renderProjectList() {
  var list = getStoredProjects();
  var el = document.getElementById('pmList');
  var countEl = document.getElementById('pmCount');
  if (countEl) countEl.textContent = list.length;

  var expanded = {};
  el.querySelectorAll('.pm-item').forEach(function(it) {
    expanded[it.dataset.name] = it.classList.contains('expanded');
  });

  if (list.length === 0) {
    el.innerHTML = '<div class="pm-empty">暂无作品，点击「新建」开始</div>';
    return;
  }

  el.innerHTML = list.map(function(p) {
    var isActive = project && p.name === project.name;
    var isExp = expanded[p.name] !== undefined ? expanded[p.name] : isActive;
    var d = new Date(p.updatedAt || p.createdAt || Date.now());
    var meta = d.toLocaleDateString() + ' ' + d.toLocaleTimeString().slice(0, 5) +
      ' · ' + (p.characters ? p.characters.length : 0) + ' 角色 · ' +
      (p.scenes ? p.scenes.length : 0) + ' 场景 · ' +
      (p.props ? p.props.length : 0) + ' 道具';
    return '<div class="pm-item' + (isActive ? ' active' : '') + (isExp ? ' expanded' : '') + '" data-name="' + escapeHtml(p.name) + '">' +
      '<div class="pm-item-header" onclick="toggleProjectCollapse(\'' + escapeAttr(p.name) + '\')">' +
        '<div class="pm-item-name">' + escapeHtml(p.name) + '</div>' +
        '<button class="pm-icon-btn" onclick="event.stopPropagation();loadProject(\'' + escapeAttr(p.name) + '\')">加载</button>' +
      '</div>' +
      '<div class="pm-item-body">' +
        '<div class="pm-item-meta">' + meta + '</div>' +
        '<div class="pm-item-actions">' +
          '<button class="pm-icon-btn" onclick="event.stopPropagation();loadProject(\'' + escapeAttr(p.name) + '\')">加载</button>' +

// ==================== 剧本 ====================
function updateScriptMetaFromText(text) {
  var meta = document.getElementById('scriptMeta');
  if (!meta) return;
  if (text && text.trim()) {
    var charCount = text.length;
    var lineCount = text.split('\n').length;
    var paraCount = text.split(/\n\s*\n/).filter(function(p) { return p.trim().length > 0; }).length;
    meta.innerHTML =
      '<span><span class="meta-label">字数:</span> ' + charCount + '</span>' +
      '<span><span class="meta-label">行数:</span> ' + lineCount + '</span>' +
      '<span><span class="meta-label">段落:</span> ' + paraCount + '</span>';
    meta.style.display = 'flex';
  } else {
    meta.style.display = 'none';
  }
}

function handleScriptUpload(event) {
  var file = event.target.files[0];
  if (!file) return;
  var ext = file.name.split('.').pop().toLowerCase();

  if (ext === 'txt' || ext === 'md' || ext === 'markdown' || ext === 'json' || ext === 'csv') {
    var reader = new FileReader();
    reader.onload = function(e) { insertScriptText(e.target.result); };
    reader.onerror = function() { showToast('读取文件失败'); };
    reader.readAsText(file, 'UTF-8');
    event.target.value = '';
    return;
  }

  if (ext === 'docx') {
    if (typeof mammoth === 'undefined') {
      showToast('正在加载文档解析库，请稍后重试...');
      var s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js';
      s.onload = function() { handleScriptUpload(event); };
      s.onerror = function() { showToast('无法加载解析库，请将 .docx 另存为 .txt 后重试'); };
      document.head.appendChild(s);
      event.target.value = '';
      return;
    }
    var reader2 = new FileReader();
    reader2.onload = function(e) {
      mammoth.extractRawText({ arrayBuffer: e.target.result })
        .then(function(result) {
          if (!result.value || !result.value.trim()) { showToast('文档内容为空或无法提取'); return; }
          insertScriptText(result.value);
        })
        .catch(function(err) { showToast('解析 .docx 失败: ' + err.message); });
    };
    reader2.readAsArrayBuffer(file);
    event.target.value = '';
    return;
  }

  if (ext === 'doc') { showToast('暂不支持 .doc 旧格式，请另存为 .docx 或 .txt'); event.target.value = ''; return; }
  showToast('不支持的文件格式：.' + ext);
  event.target.value = '';
}

function insertScriptText(text) {
  var ta = document.getElementById('scriptInput');
  if (ta.value.trim().length > 0) {
    showConfirm('当前剧本已有内容，是否追加？\n（选择「覆盖」则替换现有内容）',
      function() { ta.value = ta.value.trim() + '\n\n' + text; afterScriptChange(); showToast('剧本已追加'); },
      function() { ta.value = text; afterScriptChange(); showToast('剧本已导入'); },
      '追加', '覆盖');
  } else {
    ta.value = text;
    afterScriptChange();
    showToast('剧本已导入');
  }
}

function afterScriptChange() {
  updateScriptMetaFromText(document.getElementById('scriptInput').value);
  scheduleAutoSave();
}

function exportScript() {
  var text = document.getElementById('scriptInput').value;
  if (!text.trim()) { showToast('剧本内容为空'); return; }
  var fileName = safeName(document.getElementById('projectName').value) + '_剧本.txt';

function clearScript() {

    document.getElementById('scriptInput').value = '';

function downloadBlob(content, fileName, mime) {
  var blob = new Blob([content], { type: mime || 'text/plain;charset=utf-8' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = fileName;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(function() { URL.revokeObjectURL(url); }, 2000);
}

  if (!/^image\//.test(file.type)) { showToast('请选择图片文件'); event.target.value = ''; return; }
  compressImage(file, 1280, 0.82, function(dataUrl) {
    var item = getRefArr(pendingRef.type).find(function(x) { return x.id === pendingRef.id; });
    if (item) {
      item.image = dataUrl;

  });
  event.target.value = '';

// 图片压缩为 JPEG dataURL，减小体积，避免 localStorage / 云端备份过大
function compressImage(file, maxDim, quality, cb) {
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      var w = img.width, h = img.height;
      var scale = Math.min(1, maxDim / Math.max(w, h));
      var cw = Math.max(1, Math.round(w * scale));
      var ch = Math.max(1, Math.round(h * scale));
      var canvas = document.createElement('canvas');
      canvas.width = cw; canvas.height = ch;
      canvas.getContext('2d').drawImage(img, 0, 0, cw, ch);
      try { cb(canvas.toDataURL('image/jpeg', quality || 0.82)); }
      catch(err) { cb(e.target.result); }
    };
    img.onerror = function() { cb(e.target.result); };
    img.src = e.target.result;
  };
  reader.onerror = function() { showToast('读取图片失败'); };
  reader.readAsDataURL(file);
}

function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text).catch(function() { return fallbackCopy(text); });
  }
  return Promise.resolve(fallbackCopy(text));
}
function fallbackCopy(text) {
  var ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); } catch(e) {}
  document.body.removeChild(ta);
}

// ==================== 云端备份（参考拉片平台：读取合并，不易覆盖） ====================
function aiGetToken() {
  var t = localStorage.getItem(CLOUD_TOKEN_KEY) || '';
  if (t) return t;
  try {
    if (window.parent && window.parent.EMBEDDED_TOKEN) return window.parent.EMBEDDED_TOKEN;
    if (window.parent) { var pt = window.parent.localStorage.getItem(CLOUD_TOKEN_KEY); if (pt) return pt; }
  } catch(e) {}
  return '';
}

function setCloudStatus(msg, color) {
  var el = document.getElementById('aiCloudStatus');
  if (el) { el.textContent = msg || ''; el.style.color = color || 'var(--muted)'; }
}

function safeBtoa(str) {
  var bytes = new TextEncoder().encode(str);
  var binary = '';
  var chunk = 8192;
  for (var i = 0; i < bytes.length; i += chunk) {
    binary += String.fromCharCode.apply(null, bytes.slice(i, i + chunk));
  }
  return btoa(binary);
}

async function aiFetchCloud() {
  var token = aiGetToken();
  if (!token) throw new Error('未设置 GitHub Token');
  var url = 'https://api.github.com/repos/' + CLOUD_REPO + '/contents/' + CLOUD_FILE;
  var r = await fetch(url, { headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json' } });
  if (!r.ok) { if (r.status === 404) return { sha: null, data: {} }; throw new Error('API ' + r.status); }
  var d = await r.json();
  var data = {};
  try {
    var content = decodeURIComponent(escape(atob((d.content || '').replace(/\n/g, ''))));
    data = JSON.parse(content);
  } catch(e) { data = {}; }
  return { sha: d.sha, data: data };
}

async function aiCloudBackup() {
  var token = aiGetToken();
  if (!token) { showToast('请先在平台设置中输入 GitHub Token'); setCloudStatus('未设置 Token', 'var(--danger)'); return; }
  var btn = document.getElementById('aiCloudBackupBtn');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ 备份中...'; }
  setCloudStatus('正在备份到云端...', 'var(--accent)');
  try {
    // 先保存到本地，确保备份的是最新数据
    project.name = (document.getElementById('projectName').value || '').trim() || '未命名作品';
    project.script = document.getElementById('scriptInput').value;
    project.updatedAt = Date.now();
    persistProject(true);
    savePhrases();

    // 读取云端已有内容并合并，只更新 AI 相关字段，避免覆盖拉片等其他数据
    var cloud;
    try { cloud = await aiFetchCloud(); } catch(e) { cloud = { sha: null, data: {} }; }
    cloud.data = cloud.data || {};
    cloud.data.aiProjects = localStorage.getItem(STORAGE_KEY) || '[]';
    cloud.data.aiPhrases = localStorage.getItem(PHRASES_KEY) || '[]';
    cloud.data.aiTimestamp = Date.now();

    var content = safeBtoa(JSON.stringify(cloud.data));
    var body = { message: 'AI短片备份 ' + new Date().toLocaleString(), content: content };
    if (cloud.sha) body.sha = cloud.sha;
    var url = 'https://api.github.com/repos/' + CLOUD_REPO + '/contents/' + CLOUD_FILE;
    var r2 = await fetch(url, {
      method: 'PUT',
      headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (r2.ok) {
      setCloudStatus('✓ 备份成功 ' + new Date().toLocaleTimeString(), 'var(--success)');
      showToast('已备份到云端');
    } else {
      var err = await r2.json().catch(function() { return {}; });
      setCloudStatus('✗ ' + (err.message || '失败'), 'var(--danger)');
      showToast('云端备份失败：' + (err.message || ''));
    }
  } catch(err) {
    setCloudStatus('✗ ' + err.message, 'var(--danger)');
    showToast('云端备份失败：' + err.message);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '☁️ 云端备份'; }
  }
}

async function aiCloudRestore() {
  var token = aiGetToken();
  if (!token) { showToast('请先在平台设置中输入 GitHub Token'); setCloudStatus('未设置 Token', 'var(--danger)'); return; }
  var btn = document.getElementById('aiCloudRestoreBtn');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ 恢复中...'; }
  setCloudStatus('正在从云端恢复...', 'var(--accent)');
  try {
    var cloud = await aiFetchCloud();
    if (cloud.data.aiProjects) {
      // 合并：按名称合并云端与本地作品，云端较新则采用，避免直接覆盖丢失本地
      var localList = getStoredProjects();
      var merged = mergeProjects(localList, JSON.parse(cloud.data.aiProjects || '[]'));
      setStoredProjects(merged);
    }
    if (cloud.data.aiPhrases) {
      var cloudPhrases = [];
      try { cloudPhrases = JSON.parse(cloud.data.aiPhrases); } catch(e) {}
      if (Array.isArray(cloudPhrases)) {
        var seen = {}; phrases.forEach(function(p) { seen[p.text] = true; });
        cloudPhrases.forEach(function(p) { if (!seen[p.text]) { phrases.push(p); seen[p.text] = true; } });
        savePhrases();
      }
    }
    renderPhrases();
    // 重新载入当前作品
    var list = getStoredProjects();
    var cname = localStorage.getItem(CURRENT_KEY);
    var found = list.find(function(p) { return p.name === cname; }) || list[0];
    if (found) { project = migrateProject(found); applyProjectToUI(); }
    renderProjectList();
    var ts = cloud.data.aiTimestamp ? new Date(cloud.data.aiTimestamp).toLocaleString() : '未知时间';
    setCloudStatus('✓ 恢复成功 (' + ts + ')', 'var(--success)');
    showToast('已从云端恢复');
  } catch(err) {
    setCloudStatus('✗ ' + err.message, 'var(--danger)');
    showToast('恢复失败：' + err.message);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '⬇️ 云端恢复'; }
  }
}

// 合并本地与云端作品列表：同名作品取更新时间较新者，其余全部保留
function mergeProjects(localList, cloudList) {
  var map = {};
  (localList || []).forEach(function(p) { map[p.name] = p; });
  (cloudList || []).forEach(function(c) {
    var l = map[c.name];
    if (!l) { map[c.name] = c; }
    else if ((c.updatedAt || 0) > (l.updatedAt || 0)) { map[c.name] = c; }
  });
  return Object.keys(map).map(function(k) { return map[k]; });
}

function showConfirm(msg, onOk, onCancel, okText, cancelText) {
  document.getElementById('modalMsg').textContent = msg;
  var btns = document.getElementById('modalBtns');
  btns.innerHTML = '';
  if (onCancel) {
    var bCancel = document.createElement('button');
    bCancel.className = 'btn btn-secondary btn-sm';
    bCancel.textContent = cancelText || '取消';
    bCancel.onclick = function() { closeModal(); if (onCancel) onCancel(); };
    btns.appendChild(bCancel);
  }
  var bOk = document.createElement('button');
  bOk.className = 'btn btn-primary btn-sm';
  bOk.textContent = okText || '确定';
  bOk.onclick = function() { closeModal(); if (onOk) onOk(); };
  btns.appendChild(bOk);
  document.getElementById('modalOverlay').classList.add('show');
}
function closeModal(e) {
  if (e && e.target && e.target.id !== 'modalOverlay') return;
  document.getElementById('modalOverlay').classList.remove('show');
}

var toastTimer = null;
function showToast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function() { el.classList.remove('show'); }, 2200);
}

// ==================== 主题 ====================
function applyPageTheme() {
  var mode = localStorage.getItem(THEME_KEY) || 'light';
  var root = document.documentElement;
  if (mode === 'dark') {
    root.style.setProperty('--bg', '#0a0e1a');
    root.style.setProperty('--bg2', '#1c2333');
    root.style.setProperty('--bg3', '#131826');
    root.style.setProperty('--ink', '#e8edf5');
    root.style.setProperty('--muted', '#8a96b0');
    root.style.setProperty('--rule', '#2a3344');
    root.style.setProperty('--glass', 'rgba(28,35,51,0.55)');
    root.style.setProperty('--input-bg', '#1c2333');
    root.style.setProperty('--shadow', '0 1px 3px rgba(0,0,0,0.4)');
    root.style.setProperty('--shadow-lg', '0 8px 24px rgba(0,0,0,0.5)');
  } else {
    root.style.setProperty('--bg', '#f5f6f8');
    root.style.setProperty('--bg2', '#ffffff');
    root.style.setProperty('--bg3', '#f0f2f5');
    root.style.setProperty('--ink', '#1a1a2e');
    root.style.setProperty('--muted', '#6b7280');
    root.style.setProperty('--rule', '#e5e7eb');
    root.style.setProperty('--glass', 'rgba(255,255,255,0.75)');
    root.style.setProperty('--input-bg', '#ffffff');
    root.style.setProperty('--shadow', '0 1px 3px rgba(0,0,0,0.06)');
    root.style.setProperty('--shadow-lg', '0 8px 24px rgba(0,0,0,0.12)');
  }
}

// 监听父窗口消息（主题 / 云端）
window.addEventListener('message', function(e) {
  if (!e.data) return;
  if (e.data.type === 'theme') {
    if (e.data.mode) localStorage.setItem(THEME_KEY, e.data.mode);
    applyPageTheme();
  } else if (e.data.type === 'cloudRestored') {
    // 平台已完成云端恢复，重新载入本地数据
    var list = getStoredProjects();
    var cname = localStorage.getItem(CURRENT_KEY);
    var found = list.find(function(p) { return p.name === cname; }) || list[0];
    if (found) { project = migrateProject(found); applyProjectToUI(); }
    renderProjectList();
    renderPhrases();
    showToast('已从云端同步最新数据');
  }
});

// ==================== 初始化 ====================
(function init() {
  loadPhrases();

  var list = getStoredProjects();
  var cname = localStorage.getItem(CURRENT_KEY);
  var found = cname ? list.find(function(p) { return p.name === cname; }) : null;
  if (found) {
    project = migrateProject(found);
  } else if (list.length) {
    project = migrateProject(list[0]);
  } else {
    project = emptyProject();
  }

  applyProjectToUI();
  renderPhrases();
  renderProjectList();
  applyPageTheme();

  // 监听输入，标记需要自动保存
  document.addEventListener('input', function(e) {
    if (e.target && (e.target.id === 'scriptInput' || e.target.id === 'projectName' || e.target.classList.contains('ref-name'))) {
      if (e.target.id === 'scriptInput') updateScriptMetaFromText(e.target.value);
      scheduleAutoSave();
    }
  });

  window.addEventListener('beforeunload', function() {
    if (autoSaveTimer) {
      clearTimeout(autoSaveTimer);
      try {
        project.name = (document.getElementById('projectName').value || '').trim() || '未命名作品';
        project.script = document.getElementById('scriptInput').value;
        project.updatedAt = Date.now();
        persistProject(true);
      } catch(e) {}
    }
  });

  try { window.parent.postMessage({ type: 'ready' }, '*'); } catch(e) {}
  setCloudStatus(aiGetToken() ? '云端已就绪' : '未设置 Token（可在平台设置）', aiGetToken() ? 'var(--muted)' : 'var(--warning)');
})();
</script>
