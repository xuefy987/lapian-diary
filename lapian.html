<style>

  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  }

  .app-container {

  }

  /* ========== 左侧片名栏 ========== */
  .sidebar-left {

  }

  .sidebar-header {

    justify-content: space-between;
  }

  .sidebar-header h1 {
    font-size: 16px;
    font-weight: 600;
    color: var(--ink);
  }

  .btn {
    cursor: pointer;
    border: none;
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 13px;
    font-weight: 500;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  .btn-primary { background: var(--accent); color: white; }
  .btn-primary:hover { background: #4338ca; }
  .btn-secondary { background: var(--bg3); color: var(--ink); }
  .btn-secondary:hover { background: var(--rule); }
  .btn-danger { background: var(--danger); color: white; }
  .btn-danger:hover { background: #dc2626; }

  .btn-icon {
    padding: 6px 8px;
    background: transparent;
    color: var(--muted);
    border: none;
    cursor: pointer;
    border-radius: 4px;
    font-size: 13px;
    transition: all 0.15s;
  }
  .btn-icon:hover { background: var(--bg3); color: var(--ink); }

  .film-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }

  .film-item {
    padding: 10px 12px;
    border-radius: 6px;
    cursor: pointer;
    margin-bottom: 2px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: background 0.15s;
  }

  .film-item:hover { background: var(--bg3); }

  .film-item.active {
    background: var(--accent-light);
    color: var(--accent);
    font-weight: 500;
  }

  .film-item-title {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .film-item-actions { display: none; gap: 2px; }
  .film-item:hover .film-item-actions { display: flex; }
  .film-item .btn-icon { padding: 2px 4px; font-size: 12px; }

  /* ========== 中间主编辑区 ========== */
  .main-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    background: var(--bg);
  }

  .main-header {
    padding: 12px 20px;
    background: var(--bg2);
    border-bottom: 1px solid var(--rule);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .film-title-input {
    font-size: 18px;
    font-weight: 600;
    border: none;
    outline: none;
    background: transparent;
    color: var(--ink);
    width: 100%;
    max-width: 400px;
  }

  .film-title-input:focus { border-bottom: 2px solid var(--accent); }

  /* 工具栏 */
  .toolbar {
    padding: 8px 16px;
    background: var(--bg2);
    border-bottom: 1px solid var(--rule);
    display: flex;
    align-items: center;
    gap: 4px;
    flex-wrap: wrap;
  }

  .toolbar-group {
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 0 8px;
    border-right: 1px solid var(--rule);
  }
  .toolbar-group:last-child { border-right: none; }

  .toolbar-btn {
    width: 32px;
    height: 32px;
    border: none;
    background: transparent;
    cursor: pointer;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    color: var(--ink);
    transition: background 0.15s;
  }

  .toolbar-btn:hover { background: var(--bg3); }
  .toolbar-btn.active { background: var(--accent-light); color: var(--accent); }

  .toolbar-btn.bold { font-weight: 700; }
  .toolbar-btn.italic { font-style: italic; }
  .toolbar-btn.underline { text-decoration: underline; }

  .color-picker-wrapper { position: relative; }

  .color-picker-dropdown {
    position: absolute;
    top: 100%;
    left: 0;
    background: var(--bg2);
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 8px;
    box-shadow: var(--shadow-lg);
    z-index: 100;
    display: none;
    width: 180px;
  }

  .color-picker-dropdown.show { display: block; }

  .color-grid {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 4px;
  }

  .color-swatch {
    width: 20px;
    height: 20px;
    border-radius: 3px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform 0.1s;
  }
  .color-swatch:hover { transform: scale(1.15); }

  .font-size-select {
    padding: 4px 6px;
    border: 1px solid var(--rule);
    border-radius: 4px;
    font-size: 12px;
    background: var(--bg2);
    cursor: pointer;
    outline: none;
  }

  /* 拉片内容区 - 序号行 */
  .lapian-content {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
    padding-bottom: 80px;
  }

  .lapian-rows {
    max-width: 900px;
    margin: 0 auto;
  }

  .lapian-row {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 6px 8px;
    border-radius: 6px;
    margin-bottom: 2px;
    transition: background 0.15s;
    position: relative;
  }

  .lapian-row:hover { background: rgba(0,0,0,0.02); }

  .lapian-row.has-event {
    border-left: 3px solid var(--accent);
  }

  .row-left {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
    padding-top: 5px;
  }

  .row-checkbox {
    width: 16px;
    height: 16px;
    cursor: pointer;
    accent-color: var(--accent);
  }

  .row-number {
    width: 26px;
    height: 26px;
    background: var(--accent);
    color: white;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    font-size: 12px;
    flex-shrink: 0;
  }

  .row-time {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
    padding-top: 3px;
  }

  .time-input {
    width: 72px;
    padding: 3px 6px;
    border: 1px solid var(--rule);
    border-radius: 4px;
    font-size: 11px;
    font-family: 'Courier New', monospace;
    outline: none;
    text-align: center;
  }

  .time-start {
    background: var(--bg3);
    color: var(--muted);
  }

  .time-start.editable {
    background: var(--bg2);
    color: var(--ink);
  }

  .time-end {
    background: var(--bg2);
  }

  .time-end:focus, .time-start.editable:focus { border-color: var(--accent); }

  .time-arrow {
    color: var(--muted);
    font-size: 11px;
  }

  .row-content {
    flex: 1;
    min-height: 28px;
    padding: 5px 10px;
    border: 1px solid transparent;
    border-radius: 4px;
    outline: none;
    line-height: 1.8;
    min-width: 0;
    word-break: break-word;
  }

  .row-content:focus { border-color: var(--accent); }
  .row-content:empty:before { content: attr(data-placeholder); color: var(--muted); }

  .row-delete {
    opacity: 0;
    background: transparent;
    border: none;
    color: var(--danger);
    cursor: pointer;
    font-size: 18px;
    padding: 2px 6px;
    transition: opacity 0.15s;
    flex-shrink: 0;
    border-radius: 4px;
    margin-top: 2px;
  }

  .lapian-row:hover .row-delete { opacity: 0.5; }
  .row-delete:hover { opacity: 1 !important; background: rgba(239,68,68,0.1); }

  /* 合并事件操作栏 */
  .merge-action-bar {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--ink);
    color: white;
    padding: 10px 20px;
    border-radius: 24px;
    display: none;
    align-items: center;
    gap: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.25);
    z-index: 200;
    opacity: 0;
    transition: opacity 0.2s, transform 0.2s;
  }

  .merge-action-bar.show {
    display: flex;
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .merge-action-bar .btn {
    background: var(--accent);
    color: white;
  }
  .merge-action-bar .btn:hover { background: #4338ca; }

  .merge-action-bar .btn-secondary {
    background: rgba(255,255,255,0.2);
    color: white;
  }
  .merge-action-bar .btn-secondary:hover { background: rgba(255,255,255,0.3); }

  /* ========== 右侧面板 ========== */
  .sidebar-right {
    width: 320px;
    min-width: 200px;
    max-width: 500px;
    background: var(--bg2);
    border-left: 1px solid var(--rule);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    transition: width 0.2s ease;
    position: relative;
  }

  .sidebar-right.collapsed {
    width: 40px;
    min-width: 40px;
  }

  .sidebar-right.collapsed .right-panel-header,
  .sidebar-right.collapsed .right-panel-content { display: none; }

  .toggle-panel-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 18px;
    height: 48px;
    background: var(--bg2);
    border: 1px solid var(--rule);
    border-radius: 4px 0 0 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 10;
    left: -18px;
    color: var(--muted);
    font-size: 10px;
    transition: all 0.15s;
  }

  .toggle-panel-btn:hover { background: var(--accent-light); color: var(--accent); }

  .sidebar-right.collapsed .toggle-panel-btn {
    left: 0;
    border-radius: 0 4px 4px 0;
    width: 40px;
    height: 100%;
    transform: none;
    top: 0;
    font-size: 14px;
  }

  .right-panel-header {
    display: flex;
    align-items: center;
    border-bottom: 1px solid var(--rule);
    background: var(--bg3);
  }

  .right-tab {
    flex: 1;
    padding: 10px;
    text-align: center;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    border-bottom: 2px solid transparent;
    transition: all 0.15s;
    user-select: none;
  }

  .right-tab:hover { color: var(--ink); }
  .right-tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
    background: var(--bg2);
  }

  .swap-btn {
    padding: 8px 10px;
    background: transparent;
    border: none;
    border-left: 1px solid var(--rule);
    cursor: pointer;
    color: var(--muted);
    font-size: 14px;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .swap-btn:hover { color: var(--accent); background: var(--bg2); }

  .right-panel-content {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
  }

  .panel-section { margin-bottom: 20px; }

  .panel-section h3 {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 8px;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .panel-editor {
    min-height: 80px;
    padding: 10px;
    border: 1px solid var(--rule);
    border-radius: 6px;
    outline: none;
    font-size: 13px;
    line-height: 1.7;
    background: var(--bg2);
  }

  .panel-editor:focus { border-color: var(--accent); }
  .panel-editor:empty:before { content: attr(data-placeholder); color: var(--muted); }

  /* 统计卡片 */
  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 16px;
  }

  .stat-card {
    background: var(--bg3);
    border-radius: 6px;
    padding: 12px;
    text-align: center;
  }

  .stat-number {
    font-size: 24px;
    font-weight: 700;
    color: var(--accent);
  }

  .stat-label {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }

  /* 事件列表 - 可编辑 */
  .event-list { list-style: none; }

  .event-item-editable {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border-radius: 6px;
    margin-bottom: 6px;
    background: var(--bg3);
    border: 1px solid transparent;
    transition: border-color 0.15s;
  }

  .event-item-editable:hover { border-color: var(--rule); }

  .event-color-input {
    width: 24px;
    height: 24px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    padding: 0;
    flex-shrink: 0;
    background: none;
  }
  .event-color-input::-webkit-color-swatch { border: 1px solid var(--rule); border-radius: 4px; }
  .event-color-input::-moz-color-swatch { border: 1px solid var(--rule); border-radius: 4px; }

  .event-name-edit {
    flex: 1;
    border: none;
    background: transparent;
    outline: none;
    font-size: 13px;
    color: var(--ink);
    min-width: 0;
  }
  .event-name-edit:focus { border-bottom: 1px solid var(--accent); }

  .event-rows-info {
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
    flex-shrink: 0;
  }

  .event-delete-btn {
    background: transparent;
    border: none;
    color: var(--danger);
    cursor: pointer;
    font-size: 16px;
    padding: 2px 4px;
    border-radius: 4px;
    opacity: 0.5;
    transition: opacity 0.15s;
    flex-shrink: 0;
  }
  .event-delete-btn:hover { opacity: 1; background: rgba(239,68,68,0.1); }

  /* 分隔条 */
  .resizer {
    width: 4px;
    background: var(--rule);
    cursor: col-resize;
    flex-shrink: 0;
    transition: background 0.15s;
  }
  .resizer:hover, .resizer.active { background: var(--accent); }

  /* ========== 模态框 ========== */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
  }

  .modal-overlay.show { display: flex; }

  .modal {
    background: var(--bg2);
    border-radius: 10px;
    padding: 24px;
    width: 90%;
    max-width: 480px;
    box-shadow: var(--shadow-lg);
  }

  .modal h2 { font-size: 18px; margin-bottom: 16px; }

  .modal-input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--rule);
    border-radius: 6px;
    font-size: 14px;
    margin-bottom: 16px;
    outline: none;
  }
  .modal-input:focus { border-color: var(--accent); }

  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }

  /* 合并事件模态框 */
  .merge-event-modal { max-width: 420px; }

  .merge-event-colors {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
    margin-bottom: 16px;
  }

  .merge-color-option {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 6px;
    cursor: pointer;
    border: 3px solid transparent;
    transition: transform 0.1s;
  }
  .merge-color-option:hover { transform: scale(1.1); }
  .merge-color-option.selected { border-color: var(--ink); }

  /* 评论标记 */
  .comment-marker {
    background: rgba(251,191,36,0.15);
    border-bottom: 2px solid var(--warning);
    cursor: pointer;
    position: relative;
  }
  .comment-marker:hover { background: rgba(251,191,36,0.25); }

  .comment-bubble {
    position: absolute;
    bottom: 100%;
    left: 50%;
    transform: translateX(-50%);
    background: var(--bg2);
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 12px;
    white-space: nowrap;
    box-shadow: var(--shadow-lg);
    z-index: 10;
    display: none;
    margin-bottom: 4px;
    max-width: 300px;
    white-space: normal;
  }
  .comment-marker:hover .comment-bubble { display: block; }

  .comment-list-panel {
    max-height: 200px;
    overflow-y: auto;
    margin-bottom: 16px;
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 8px;
  }

  .comment-item {
    padding: 8px;
    border-bottom: 1px solid var(--rule);
    font-size: 13px;
  }
  .comment-item:last-child { border-bottom: none; }

  .comment-meta {
    display: flex;
    justify-content: space-between;
    color: var(--muted);
    font-size: 11px;
    margin-bottom: 4px;
  }

  .comment-textarea {
    width: 100%;
    min-height: 80px;
    padding: 10px 12px;
    border: 1px solid var(--rule);
    border-radius: 6px;
    font-size: 14px;
    margin-bottom: 16px;
    outline: none;
    resize: vertical;
    font-family: inherit;
  }
  .comment-textarea:focus { border-color: var(--accent); }

  /* 历史记录条目 */
  .history-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px;
    border: 1px solid var(--rule);
    border-radius: 6px;
    margin-bottom: 8px;
    transition: border-color 0.15s;
  }
  .history-item:hover { border-color: var(--accent); }
  .history-info { flex: 1; min-width: 0; }
  .history-time { font-size: 14px; font-weight: 500; color: var(--ink); }
  .history-detail { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .history-actions { display: flex; gap: 4px; flex-shrink: 0; }

  /* 保存状态指示器闪烁 */
  .save-flash { animation: saveFlash 1s ease; }
  @keyframes saveFlash {
    0% { color: var(--success); font-weight: 600; }
    100% { color: var(--muted); font-weight: normal; }
  }

  /* 格式刷指示器 */
  .format-brush-indicator {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: var(--accent);
    color: white;
    padding: 10px 16px;
    border-radius: 20px;
    font-size: 13px;
    box-shadow: var(--shadow-lg);
    z-index: 999;
    display: none;
    animation: pulse 1.5s infinite;
  }
  .format-brush-indicator.show { display: block; }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }

  /* Toast */
  .toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: var(--ink);
    color: white;
    padding: 10px 20px;
    border-radius: 6px;
    font-size: 14px;
    z-index: 2000;
    opacity: 0;
    transition: opacity 0.3s, transform 0.3s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* 移动端 */
  .mobile-menu-btn { display: none; }

  .mobile-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.4);
    z-index: 99;
    display: none;
  }
  .mobile-overlay.show { display: block; }

  @media (max-width: 1024px) {
    .sidebar-left {
      position: fixed;
      left: 0; top: 0; bottom: 0;
      z-index: 100;
      transform: translateX(-100%);
      transition: transform 0.3s ease;
      width: 280px;
      box-shadow: var(--shadow-lg);
    }
    .sidebar-left.open { transform: translateX(0); }

    .sidebar-right {
      position: fixed;
      right: 0; top: 0; bottom: 0;
      z-index: 100;
      transform: translateX(100%);
      transition: transform 0.3s ease;
      width: 300px;
      box-shadow: var(--shadow-lg);
    }
    .sidebar-right.open { transform: translateX(0); }
    .sidebar-right.collapsed { width: 300px; min-width: 300px; }

    .mobile-menu-btn { display: inline-flex; }
    .resizer { display: none; }
    .toggle-panel-btn { display: none; }
  }

  @media (max-width: 640px) {
    .toolbar { padding: 6px 8px; gap: 2px; }
    .toolbar-btn { width: 28px; height: 28px; font-size: 12px; }
    .toolbar-group { padding: 0 4px; }
    .lapian-content { padding: 10px 12px; }
    .lapian-row { flex-wrap: wrap; padding: 6px 4px; }
    .row-content { flex: 1 1 100%; margin-top: 4px; }
    .time-input { width: 56px; font-size: 10px; }
    .row-number { width: 22px; height: 22px; font-size: 11px; }
  }

  /* 空状态 */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }

  .empty-state-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.5; }
  .empty-state-text { font-size: 14px; margin-bottom: 16px; }

  /* 滚动条 */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

  /* 时间码输入框占位 */
  .time-input::placeholder { color: var(--muted); }
</style>
</head>
<body>

<div class="toast" id="toast"></div>
<div class="format-brush-indicator" id="formatBrushIndicator">🖌️ 格式刷已激活，选中目标文字应用（ESC取消）</div>

<div class="app-container">
  <!-- ========== 左侧片名栏 ========== -->

    <!-- 工具栏 -->

          <button class="toolbar-btn" onclick="toggleColorPicker('foreColor')" title="文字颜色"><span style="color:#ef4444;font-weight:700;text-decoration:underline;text-decoration-color:#ef4444;">A</span></button>
          <div class="color-picker-dropdown" id="foreColorPicker">
            <div style="font-size:12px;color:var(--muted);margin-bottom:6px;">文字颜色</div>

        <div class="color-picker-wrapper">
          <button class="toolbar-btn" onclick="toggleColorPicker('hiliteColor')" title="背景高亮"><span style="background:#fef08a;padding:0 4px;border-radius:2px;">A</span></button>
          <div class="color-picker-dropdown" id="hiliteColorPicker">
            <div style="font-size:12px;color:var(--muted);margin-bottom:6px;">背景高亮</div>
            <div class="color-grid" id="hiliteColorGrid"></div>
          </div>
        </div>
      </div>
      <div class="toolbar-group">
        <button class="toolbar-btn" onclick="execCmd('justifyLeft')" title="左对齐">⬅</button>
        <button class="toolbar-btn" onclick="execCmd('justifyCenter')" title="居中">⬌</button>
        <button class="toolbar-btn" onclick="execCmd('justifyRight')" title="右对齐">➡</button>

      <div class="toolbar-group">
        <button class="toolbar-btn" onclick="execCmd('insertUnorderedList')" title="无序列表">•≡</button>

        <button class="toolbar-btn" onclick="execCmd('redo')" title="重做">↷</button>
      </div>
    </div>

    <!-- 拉片内容区 -->
    <div class="lapian-content" id="lapianContent"></div>
  </main>

  <div class="resizer" id="resizerRight"></div>

  <!-- ========== 右侧面板 ========== -->
  <aside class="sidebar-right" id="sidebarRight">
    <div class="toggle-panel-btn" onclick="toggleRightPanel()">◀</div>
    <div class="right-panel-header" id="rightPanelHeader"></div>
    <div class="right-panel-content" id="rightPanelContent">
      <div id="plotPanel">
        <div class="panel-section">
          <h3>📋 剧情梗概</h3>
          <div class="panel-editor" contenteditable="true" id="plotSummary" data-placeholder="在此输入影片的剧情梗概..." oninput="savePlotSummary()"></div>

          <h3>👥 主要人物</h3>

            <div class="stat-number" id="totalRows">0</div>
            <div class="stat-label">序号行数</div>

            <div class="stat-number" id="totalComments">0</div>

<!-- 合并事件操作栏 -->

  <button class="btn" onclick="openMergeEventModal()">合并为事件</button>

  <div class="modal">
    <h2>重命名影片</h2>

    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal('renameModal')">取消</button>
      <button class="btn btn-primary" onclick="confirmRename()">确定</button>

</div>

<!-- 历史记录模态框 -->
<div class="modal-overlay" id="historyModal">
  <div class="modal" style="max-width:520px;">
    <h2>📜 历史记录（最近10次）</h2>
    <div id="historyList" style="max-height:400px;overflow-y:auto;margin-bottom:16px;"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal('historyModal')">关闭</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script>
// ==================== 数据管理 ====================
const STORAGE_KEY = 'lapian_platform_v2';
const OLD_KEY = 'lapian_platform_data';
const HISTORY_KEY = 'lapian_platform_history';
const MAX_HISTORY = 10;
const AUTOSAVE_INTERVAL = 180000; // 3分钟

let appData = { films: [], currentFilmId: null };
let panelOrder = ['plot', 'stats'];
let activeTab = 'plot';
const LAYOUT_PREF_KEY = 'lapian_layout_prefs';

function saveLayoutPrefs() {
  var leftW = document.getElementById('sidebarLeft') ? document.getElementById('sidebarLeft').style.width : '';
  var rightW = document.getElementById('sidebarRight') ? document.getElementById('sidebarRight').style.width : '';
  var rightCollapsed = document.getElementById('sidebarRight') && document.getElementById('sidebarRight').classList.contains('collapsed');
  var leftCollapsed = document.getElementById('sidebarLeft') && document.getElementById('sidebarLeft').classList.contains('collapsed');
  var prefs = {
    panelOrder: panelOrder,
    activeTab: activeTab,
    leftWidth: leftW,
    rightWidth: rightW,
    rightCollapsed: rightCollapsed,
    leftCollapsed: leftCollapsed
  };
  localStorage.setItem(LAYOUT_PREF_KEY, JSON.stringify(prefs));
}

function restoreLayoutPrefs() {
  try {
    var raw = localStorage.getItem(LAYOUT_PREF_KEY);
    if (!raw) return;
    var prefs = JSON.parse(raw);
    if (prefs.panelOrder) panelOrder = prefs.panelOrder;
    if (prefs.activeTab) activeTab = prefs.activeTab;
    if (prefs.leftWidth && document.getElementById('sidebarLeft')) document.getElementById('sidebarLeft').style.width = prefs.leftWidth;
    if (prefs.rightWidth && document.getElementById('sidebarRight')) document.getElementById('sidebarRight').style.width = prefs.rightWidth;
    if (prefs.rightCollapsed && document.getElementById('sidebarRight')) document.getElementById('sidebarRight').classList.add('collapsed');
    if (prefs.leftCollapsed && document.getElementById('sidebarLeft')) document.getElementById('sidebarLeft').classList.add('collapsed');
  } catch(e) {}
}
let formatBrushActive = false;
let formatBrushStyles = null;
let currentCommentRowId = null;
let currentCommentMarkerId = null;
let selectedMergeColor = null;
let renameFilmId = null;

const colors = [
  '#000000','#434343','#666666','#999999','#b7b7b7','#cccccc','#d9d9d9','#ffffff',
  '#980000','#ff0000','#ff9900','#ffff00','#00ff00','#00ffff','#4a86e8','#0000ff',
  '#9900ff','#ff00ff','#e6b8af','#f4cccc','#fce5cd','#fff2cc','#d9ead3','#d0e0e3',
  '#c9daf8','#cfe2f3','#d9d2e9','#ead1dc','#dd7e6b','#ea9999','#f9cb9c','#ffe599',
  '#b6d7a8','#a2c4c9','#a4c2f4','#9fc5e8','#b4a7d6','#d5a6bd','#cc4125','#e06666'
];

const highlightColors = [
  'transparent','#ffff00','#00ff00','#00ffff','#0000ff','#ff00ff','#ff0000','#ff9900',
  '#ffe599','#b6d7a8','#a4c2f4','#d9d2e9','#ea9999','#f9cb9c','#d0e0e3','#fff2cc'
];

const eventColors = [
  '#fef3c7','#dbeafe','#d1fae5','#fce7f3','#fed7aa','#e9d5ff',
  '#cffafe','#fee2e2','#fef9c3','#ddd6fe','#bbf7d0','#fbcfe8',
  '#fecaca','#fde68a','#bfdbfe','#a7f3d0','#fbcfe8','#ddd6fe',
  '#ffedd5','#ddd6fe','#ccfbf1','#fae8ff','#fef3c7','#e0e7ff',
  '#dcfce7','#fce7f3','#ffeee0','#e6e6fa','#f0fff0','#fff0f5',
  '#e8f5e9','#fff3e0','#f3e5f5','#e8eaf6','#e0f2f1','#fff8e1',
  '#f1f8e9','#fffde7','#e8eaf6','#fbe9e7','#e0f7fa','#f8bbd0'
];

// ==================== 初始化 ====================
function init() {
  loadData();
  initColorPickers();
  initResizers();
  restoreLayoutPrefs();
  renderFilmList();
  renderRightPanel();

  document.addEventListener('keydown', handleKeydown);
  document.addEventListener('click', function(e) {
    if (!e.target.closest('.color-picker-wrapper')) {
      document.querySelectorAll('.color-picker-dropdown').forEach(el => el.classList.remove('show'));
    }
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && formatBrushActive) deactivateFormatBrush();
  });
  document.getElementById('mobileOverlay').addEventListener('click', function() {
    document.getElementById('sidebarLeft').classList.remove('open');
    document.getElementById('sidebarRight').classList.remove('open');
    this.classList.remove('show');
  });

  // 启动自动保存（每3分钟）
  setInterval(autoSave, AUTOSAVE_INTERVAL);
  // 页面关闭前保存
  window.addEventListener('beforeunload', function() {
    saveData();
  });
  updateSaveStatus();
}

// ==================== 数据持久化 ====================
function loadData() {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) {
    try {
      appData = JSON.parse(saved);
    } catch(e) {
      initDefaultData();
    }
  } else {
    initDefaultData();
  }
  if (appData.films.length > 0 && !appData.currentFilmId) {
    appData.currentFilmId = appData.films[0].id;
  }
}

function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
  updateStats();
  if (activeTab === 'stats') renderEventList();
}

function initDefaultData() {
  const id = generateId();
  appData = {
    films: [{
      id: id,
      name: '示例 - 肖申克的救赎',
      rows: [
        { id: generateId(), number: 1, startTime: '00:00:00', endTime: '00:05:30', content: '<p><strong>开场 - 法庭审判</strong></p><p>影片开场以法庭审判场景切入，通过安迪的面部特写与法官的全景镜头交替，建立起主人公被冤枉的核心冲突。</p>', eventId: null, comments: [] },
        { id: generateId(), number: 2, startTime: '00:05:30', endTime: '00:15:00', content: '<p>安迪初入肖申克监狱，镜头语言从冷色调的外部环境逐渐过渡到暖色调的监狱内部，暗示人物命运的转变。</p>', eventId: null, comments: [] },
        { id: generateId(), number: 3, startTime: '00:15:00', endTime: '00:25:00', content: '<p>安迪与瑞德初次相遇，两人在操场上的对话奠定了全片友谊的基调。</p>', eventId: null, comments: [] },
        { id: generateId(), number: 4, startTime: '00:25:00', endTime: '00:40:00', content: '<p>安迪利用税务知识帮助狱警，开始在监狱中建立自己的地位。</p>', eventId: null, comments: [] }
      ],
      events: [],
      plotSummary: '<p>银行家安迪被冤枉杀害妻子及其情人，被判终身监禁。在肖申克监狱中，他结识了瑞德，并用智慧和毅力展开了一场长达十九年的越狱计划，最终重获自由。</p>',
      characters: '<p>安迪·杜佛兰 - 银行家，智慧坚韧<br>瑞德 - 监狱中的"万事通"<br>诺顿 - 监狱长，道貌岸然</p>',
      theme: '<p>希望与自由是人类最宝贵的财富，即使在最黑暗的环境中也不能放弃。</p>'
    }],
    currentFilmId: id
  };
  saveData();
}

function generateId() {
  return Date.now().toString(36) + Math.random().toString(36).substr(2, 9);
}

// ==================== 影片列表管理 ====================
function renderFilmList() {
  const listEl = document.getElementById('filmList');
  if (appData.films.length === 0) {
    listEl.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📽️</div><div class="empty-state-text">还没有拉片文档</div><button class="btn btn-primary" onclick="openNewFilmModal()">新建第一个</button></div>';
    renderCurrentFilm();
    return;
  }
  listEl.innerHTML = appData.films.map(film => `
    <div class="film-item ${film.id === appData.currentFilmId ? 'active' : ''}" onclick="selectFilm('${film.id}')">
      <span class="film-item-title">🎬 ${film.name}</span>
      <div class="film-item-actions">
        <button class="btn-icon" onclick="event.stopPropagation();openRenameModal('${film.id}')" title="重命名">✏️</button>
        <button class="btn-icon" onclick="event.stopPropagation();deleteFilm('${film.id}')" title="删除">🗑️</button>
      </div>
    </div>
  `).join('');
  renderCurrentFilm();
}

function selectFilm(filmId) {
  appData.currentFilmId = filmId;
  saveData();
  renderFilmList();
  if (window.innerWidth <= 1024) {
    document.getElementById('sidebarLeft').classList.remove('open');
    document.getElementById('mobileOverlay').classList.remove('show');
  }
}

function getCurrentFilm() {
  return appData.films.find(f => f.id === appData.currentFilmId);
}

function updateFilmTitle() {
  const film = getCurrentFilm();
  if (film) {
    film.name = document.getElementById('filmTitleInput').value || '未命名影片';
    saveData();
    // 更新左侧列表显示但不重渲染中间
    const items = document.querySelectorAll('.film-item');
    items.forEach(item => {
      if (item.classList.contains('active')) {
        item.querySelector('.film-item-title').textContent = '🎬 ' + film.name;
      }
    });
  }
}

function openNewFilmModal() {
  document.getElementById('newFilmName').value = '';
  document.getElementById('newFilmModal').classList.add('show');
  document.getElementById('newFilmName').focus();
}

function createNewFilm() {
  const name = document.getElementById('newFilmName').value.trim();
  if (!name) { showToast('请输入影片名称'); return; }
  const newFilm = {
    id: generateId(),
    name: name,
    rows: [{ id: generateId(), number: 1, startTime: '', endTime: '', content: '', eventId: null, comments: [] }],
    events: [],
    plotSummary: '',
    characters: '',
    theme: ''
  };
  appData.films.unshift(newFilm);
  appData.currentFilmId = newFilm.id;
  saveData();
  renderFilmList();
  closeModal('newFilmModal');
  showToast('创建成功');
}

function openRenameModal(filmId) {
  renameFilmId = filmId;
  const film = appData.films.find(f => f.id === filmId);
  document.getElementById('renameInput').value = film ? film.name : '';
  document.getElementById('renameModal').classList.add('show');
  document.getElementById('renameInput').focus();
}

function confirmRename() {
  const newName = document.getElementById('renameInput').value.trim();
  if (!newName || !renameFilmId) return;
  const film = appData.films.find(f => f.id === renameFilmId);
  if (film) { film.name = newName; saveData(); renderFilmList(); }
  closeModal('renameModal');
}

function deleteFilm(filmId) {
  if (!confirm('确定要删除这个拉片文档吗？此操作不可恢复。')) return;
  const index = appData.films.findIndex(f => f.id === filmId);
  if (index > -1) {
    appData.films.splice(index, 1);
    if (appData.currentFilmId === filmId) {
      appData.currentFilmId = appData.films.length > 0 ? appData.films[0].id : null;
    }
    saveData();
    renderFilmList();
    showToast('已删除');
  }
}

// ==================== 序号行管理 ====================
function renderCurrentFilm() {
  const film = getCurrentFilm();
  const contentEl = document.getElementById('lapianContent');
  const titleInput = document.getElementById('filmTitleInput');

  if (!film) {
    titleInput.value = '';
    contentEl.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🎬</div><div class="empty-state-text">选择或创建一个影片开始拉片</div></div>';
    document.getElementById('plotSummary').innerHTML = '';
    document.getElementById('characters').innerHTML = '';
    document.getElementById('theme').innerHTML = '';
    updateStats();
    return;
  }

  titleInput.value = film.name;
  document.getElementById('plotSummary').innerHTML = film.plotSummary || '';
  document.getElementById('characters').innerHTML = film.characters || '';
  document.getElementById('theme').innerHTML = film.theme || '';

  if (!film.rows || film.rows.length === 0) {
    film.rows = [{ id: generateId(), number: 1, startTime: '', endTime: '', content: '', eventId: null, comments: [] }];
    saveData();
  }

  const rowsContainer = document.createElement('div');
  rowsContainer.className = 'lapian-rows';
  rowsContainer.id = 'lapianRows';
  film.rows.forEach(row => {
    rowsContainer.appendChild(createRowElement(row, film));
  });
  contentEl.innerHTML = '';
  contentEl.appendChild(rowsContainer);

  updateStats();
}

function createRowElement(rowData, film) {
  const div = document.createElement('div');
  div.className = 'lapian-row';
  div.setAttribute('data-row-id', rowData.id);

  // 应用事件背景色
  if (rowData.eventId) {
    const event = film.events.find(e => e.id === rowData.eventId);
    if (event) {
      div.style.backgroundColor = event.color;
      div.classList.add('has-event');
    }
  }

  const isFirst = rowData.number === 1;

  div.innerHTML = `
    <div class="row-left">
      <input type="checkbox" class="row-checkbox" onchange="updateMergeButton()">
      <span class="row-number">${rowData.number}</span>
    </div>
    <div class="row-time">
      <input class="time-input time-start ${isFirst ? 'editable' : ''}" value="${rowData.startTime || ''}" placeholder="开始" ${isFirst ? '' : 'readonly'} onchange="updateRowStartTime('${rowData.id}', this.value)">
      <span class="time-arrow">→</span>
      <input class="time-input time-end" value="${rowData.endTime || ''}" placeholder="结束" onchange="updateRowEndTime('${rowData.id}', this.value)">
    </div>
    <div class="row-content" contenteditable="true"
         data-placeholder="输入拉片内容，按Enter新建下一序号行..."
         onkeydown="handleRowKeydown(event, this)"
         oninput="saveRowContent('${rowData.id}', this.innerHTML)"
         onclick="handleEditorClick(event)"
         onmouseup="checkFormatBrush(event)"
         id="editor-${rowData.id}">${rowData.content || ''}</div>
    <button class="row-delete" onclick="deleteRow('${rowData.id}')" title="删除此行">×</button>
  `;
  return div;
}

function handleRowKeydown(e, editor) {
  const rowEl = editor.closest('.lapian-row');
  const rowId = rowEl.getAttribute('data-row-id');

  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    addNewRowAfter(rowId);
  } else if (e.key === 'Backspace' && !e.shiftKey && !e.ctrlKey) {
    const sel = window.getSelection();
    if (sel.rangeCount > 0 && sel.isCollapsed) {
      const range = sel.getRangeAt(0);
      if (range.startOffset === 0) {
        const editor2 = document.getElementById('editor-' + rowId);
        if (editor2 && editor2.textContent.trim() === '') {
          e.preventDefault();
          deleteRow(rowId);
        }
      }
    }
  }
}

function addNewRowAfter(rowId) {
  const film = getCurrentFilm();
  if (!film) return;

  const rowIndex = film.rows.findIndex(r => r.id === rowId);
  if (rowIndex === -1) return;

  const currentRow = film.rows[rowIndex];
  const newRow = {
    id: generateId(),
    number: currentRow.number + 1,
    startTime: currentRow.endTime || '',
    endTime: '',
    content: '',
    eventId: null,
    comments: []
  };

  film.rows.splice(rowIndex + 1, 0, newRow);
  film.rows.forEach((r, i) => r.number = i + 1);
  saveData();

  // 重新渲染行
  renderRowsOnly();

  // 聚焦新行
  setTimeout(() => {
    const newEditor = document.getElementById('editor-' + newRow.id);
    if (newEditor) {
      newEditor.focus();
      const range = document.createRange();
      range.setStart(newEditor, 0);
      range.collapse(true);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }
  }, 50);
}

function renderRowsOnly() {
  const film = getCurrentFilm();
  if (!film) return;
  const contentEl = document.getElementById('lapianContent');
  const rowsContainer = document.createElement('div');
  rowsContainer.className = 'lapian-rows';
  rowsContainer.id = 'lapianRows';
  film.rows.forEach(row => {
    rowsContainer.appendChild(createRowElement(row, film));
  });
  contentEl.innerHTML = '';
  contentEl.appendChild(rowsContainer);
  updateStats();
}

function deleteRow(rowId) {
  const film = getCurrentFilm();
  if (!film) return;
  if (film.rows.length <= 1) {
    // 只有一行时清空内容而不是删除
    const row = film.rows[0];
    row.content = '';
    row.endTime = '';
    saveData();
    renderRowsOnly();
    return;
  }

  const rowIndex = film.rows.findIndex(r => r.id === rowId);
  if (rowIndex === -1) return;

  const deletedRow = film.rows[rowIndex];

  // 如果该行属于某事件，从事件中移除
  if (deletedRow.eventId) {
    const event = film.events.find(e => e.id === deletedRow.eventId);
    if (event) {
      event.rowIds = event.rowIds.filter(id => id !== rowId);
      if (event.rowIds.length === 0) {
        film.events = film.events.filter(e => e.id !== deletedRow.eventId);
      }
    }
  }

  film.rows.splice(rowIndex, 1);
  film.rows.forEach((r, i) => r.number = i + 1);

  // 重新计算时间码
  recalculateTimecodes();

  saveData();
  renderRowsOnly();
  if (activeTab === 'stats') renderEventList();
}

function recalculateTimecodes() {
  const film = getCurrentFilm();
  if (!film) return;
  for (let i = 1; i < film.rows.length; i++) {
    film.rows[i].startTime = film.rows[i - 1].endTime || '';
  }
}

function updateRowStartTime(rowId, value) {
  const film = getCurrentFilm();
  if (!film) return;
  const row = film.rows.find(r => r.id === rowId);
  if (row) {
    row.startTime = value;
    saveData();
  }
}

function updateRowEndTime(rowId, value) {
  const film = getCurrentFilm();
  if (!film) return;
  const row = film.rows.find(r => r.id === rowId);
  if (!row) return;
  row.endTime = value;

  // 更新下一行的开始时间
  const rowIndex = film.rows.findIndex(r => r.id === rowId);
  if (rowIndex < film.rows.length - 1) {
    film.rows[rowIndex + 1].startTime = value;
    // 更新DOM
    const nextRowEl = document.querySelector(`[data-row-id="${film.rows[rowIndex + 1].id}"] .time-start`);
    if (nextRowEl) nextRowEl.value = value;
  }
  saveData();
}

function saveRowContent(rowId, html) {
  const film = getCurrentFilm();
  if (!film) return;
  const row = film.rows.find(r => r.id === rowId);
  if (row) {
    row.content = html;
    saveData();
  }
}

// ==================== 合并事件 ====================
function updateMergeButton() {
  const checked = document.querySelectorAll('.row-checkbox:checked');
  const bar = document.getElementById('mergeActionBar');
  document.getElementById('selectedCount').textContent = `已选 ${checked.length} 项`;
  if (checked.length >= 1) {
    bar.classList.add('show');
  } else {
    bar.classList.remove('show');
  }
}

function clearRowSelection() {
  document.querySelectorAll('.row-checkbox').forEach(cb => cb.checked = false);
  document.getElementById('mergeActionBar').classList.remove('show');
}

function getSelectedRowIds() {
  return Array.from(document.querySelectorAll('.row-checkbox:checked')).map(cb => {
    return cb.closest('.lapian-row').getAttribute('data-row-id');
  });
}

function openMergeEventModal() {
  const selectedIds = getSelectedRowIds();
  if (selectedIds.length === 0) {
    showToast('请先勾选序号行');
    return;
  }

  // 渲染颜色选择
  const grid = document.getElementById('mergeColorGrid');
  grid.innerHTML = eventColors.map(color => `
    <div class="merge-color-option" style="background:${color};" onclick="selectMergeColor('${color}', this)"></div>
  `).join('');

  document.getElementById('eventNameInput').value = '';
  selectedMergeColor = null;
  document.getElementById('mergeEventModal').classList.add('show');

  // 默认选中第一个颜色
  const firstColor = grid.querySelector('.merge-color-option');
  if (firstColor) {
    selectMergeColor(eventColors[0], firstColor);
  }
  document.getElementById('eventNameInput').focus();
}

function selectMergeColor(color, el) {
  selectedMergeColor = color;
  document.querySelectorAll('.merge-color-option').forEach(o => o.classList.remove('selected'));
  el.classList.add('selected');
}

function confirmMergeEvent() {
  const name = document.getElementById('eventNameInput').value.trim();
  if (!name) { showToast('请输入事件名称'); return; }
  if (!selectedMergeColor) { showToast('请选择背景颜色'); return; }

  const film = getCurrentFilm();
  if (!film) return;

  const selectedIds = getSelectedRowIds();

  // 创建新事件
  const eventId = generateId();
  const newEvent = {
    id: eventId,
    name: name,
    color: selectedMergeColor,
    rowIds: selectedIds.slice()
  };
  film.events.push(newEvent);

  // 给选中行分配事件
  selectedIds.forEach(rowId => {
    const row = film.rows.find(r => r.id === rowId);
    if (row) {
      // 如果行已有事件，从旧事件中移除
      if (row.eventId) {
        const oldEvent = film.events.find(e => e.id === row.eventId);
        if (oldEvent) {
          oldEvent.rowIds = oldEvent.rowIds.filter(id => id !== rowId);
          if (oldEvent.rowIds.length === 0) {
            film.events = film.events.filter(e => e.id !== oldEvent.id);
          }
        }
      }
      row.eventId = eventId;
    }
  });

  saveData();
  renderRowsOnly();
  renderEventList();
  clearRowSelection();
  closeModal('mergeEventModal');
  showToast('事件已创建');
}

function deleteEvent(eventId) {
  const film = getCurrentFilm();
  if (!film) return;
  const event = film.events.find(e => e.id === eventId);
  if (event) {
    // 清除行上的事件标记
    event.rowIds.forEach(rowId => {
      const row = film.rows.find(r => r.id === rowId);
      if (row) row.eventId = null;
    });
    film.events = film.events.filter(e => e.id !== eventId);
    saveData();
    renderRowsOnly();
    renderEventList();
    showToast('事件已删除');
  }
}

function updateEventName(eventId, name) {
  const film = getCurrentFilm();
  if (!film) return;
  const event = film.events.find(e => e.id === eventId);
  if (event) {
    event.name = name;
    saveData();
  }
}

function updateEventColor(eventId, color) {
  const film = getCurrentFilm();
  if (!film) return;
  const event = film.events.find(e => e.id === eventId);
  if (event) {
    event.color = color;
    saveData();
    renderRowsOnly();
  }
}

// ==================== 事件列表渲染（可编辑）====================
function renderEventList() {
  const film = getCurrentFilm();
  const listEl = document.getElementById('eventList');

  if (!film || !film.events || film.events.length === 0) {
    listEl.innerHTML = '<div style="text-align:center;color:var(--muted);padding:20px;font-size:13px;">暂无事件<br><span style="font-size:11px;">在中间区域勾选序号行后点击"合并为事件"</span></div>';
    return;
  }

  listEl.innerHTML = film.events.map(event => {
    const rowNums = event.rowIds.map(rid => {
      const r = film.rows.find(row => row.id === rid);
      return r ? r.number : null;
    }).filter(n => n !== null).sort((a, b) => a - b);

    let rowText = '';
    if (rowNums.length > 0) {
      // 合并连续的序号
      const ranges = [];
      let start = rowNums[0], end = rowNums[0];
      for (let i = 1; i < rowNums.length; i++) {
        if (rowNums[i] === end + 1) {
          end = rowNums[i];
        } else {
          ranges.push(start === end ? `#${start}` : `#${start}-${end}`);
          start = end = rowNums[i];
        }
      }
      ranges.push(start === end ? `#${start}` : `#${start}-${end}`);
      rowText = ranges.join(', ') + ` (${rowNums.length}行)`;
    }

    return `
      <div class="event-item-editable">
        <input type="color" class="event-color-input" value="${event.color}" onchange="updateEventColor('${event.id}', this.value)">
        <input type="text" class="event-name-edit" value="${event.name}" oninput="updateEventName('${event.id}', this.value)" placeholder="事件名称">
        <span class="event-rows-info">${rowText}</span>
        <button class="event-delete-btn" onclick="deleteEvent('${event.id}')" title="删除事件">×</button>
      </div>
    `;
  }).join('');
}

// ==================== 统计 ====================
function updateStats() {
  const film = getCurrentFilm();
  if (!film) {
    document.getElementById('totalEvents').textContent = '0';
    document.getElementById('totalRows').textContent = '0';
    document.getElementById('totalComments').textContent = '0';
    document.getElementById('totalChars').textContent = '0';
    return;
  }

  document.getElementById('totalEvents').textContent = film.events ? film.events.length : 0;
  document.getElementById('totalRows').textContent = film.rows ? film.rows.length : 0;

  let totalComments = 0;
  let totalChars = 0;
  film.rows.forEach(row => {
    if (row.comments) totalComments += row.comments.length;
    if (row.content) {
      const text = row.content.replace(/<[^>]*>/g, '');
      totalChars += text.length;
    }
  });

  document.getElementById('totalComments').textContent = totalComments;
  document.getElementById('totalChars').textContent = totalChars.toLocaleString();
}

  saveCurrentRowContent();
}

function changeFontSize(size) {
  document.execCommand('fontSize', false, size);
  saveCurrentRowContent();
}

function initColorPickers() {
  document.getElementById('foreColorGrid').innerHTML = colors.map(color =>
    `<div class="color-swatch" style="background:${color};" onclick="applyColor('foreColor','${color}')"></div>`
  ).join('');

  });

function applyColor(type, color) {
  if (type === 'hiliteColor' && color === 'transparent') {
    document.execCommand('removeFormat', false, null);
  } else {
    document.execCommand(type, false, color);
  }
  document.getElementById(type + 'Picker').classList.remove('show');
  saveCurrentRowContent();
}

function saveCurrentRowContent() {
  const sel = window.getSelection();
  if (sel.rangeCount > 0) {
    let node = sel.anchorNode;
    while (node && !node.classList?.contains('row-content')) {
      node = node.parentNode;
    }
    if (node) {
      const rowId = node.id.replace('editor-', '');
      saveRowContent(rowId, node.innerHTML);
    }
  }
}

function handleEditorClick(e) {
  if (e.target.classList.contains('comment-marker')) {
    e.stopPropagation();
    showCommentModal(e.target.getAttribute('data-comment-id'));
  }
}

// ==================== 格式刷 ====================
function toggleFormatBrush() {
  if (formatBrushActive) {
    deactivateFormatBrush();
  } else {
    activateFormatBrush();
  }
}

function activateFormatBrush() {
  const sel = window.getSelection();
  if (sel.rangeCount === 0 || sel.isCollapsed) {
    showToast('请先选中要复制格式的文字');
    return;
  }
  const range = sel.getRangeAt(0);
  const container = range.commonAncestorContainer;
  const element = container.nodeType === 1 ? container : container.parentElement;
  const computed = window.getComputedStyle(element);
  formatBrushStyles = {
    fontWeight: computed.fontWeight,
    fontStyle: computed.fontStyle,
    textDecoration: computed.textDecoration,
    color: computed.color,
    backgroundColor: computed.backgroundColor,
    fontSize: computed.fontSize
  };
  formatBrushActive = true;
  document.getElementById('formatBrushBtn').classList.add('active');
  document.getElementById('formatBrushIndicator').classList.add('show');
}

function deactivateFormatBrush() {
  formatBrushActive = false;
  formatBrushStyles = null;
  document.getElementById('formatBrushBtn').classList.remove('active');
  document.getElementById('formatBrushIndicator').classList.remove('show');
}

function checkFormatBrush(e) {
  if (!formatBrushActive || !formatBrushStyles) return;
  const sel = window.getSelection();
  if (sel.rangeCount === 0 || sel.isCollapsed) return;
  const range = sel.getRangeAt(0);
  const text = range.toString();
  if (!text) return;

  const span = document.createElement('span');
  span.style.fontWeight = formatBrushStyles.fontWeight;
  span.style.fontStyle = formatBrushStyles.fontStyle;
  if (formatBrushStyles.textDecoration && formatBrushStyles.textDecoration !== 'none') {
    span.style.textDecoration = formatBrushStyles.textDecoration;
  }
  if (formatBrushStyles.color) span.style.color = formatBrushStyles.color;
  if (formatBrushStyles.backgroundColor && formatBrushStyles.backgroundColor !== 'rgba(0, 0, 0, 0)') {
    span.style.backgroundColor = formatBrushStyles.backgroundColor;
  }
  span.appendChild(range.extractContents());
  range.insertNode(span);

  saveCurrentRowContent();
  deactivateFormatBrush();
  showToast('格式已应用');
}

// ==================== 评论 ====================
function addComment() {
  const sel = window.getSelection();
  if (sel.rangeCount === 0 || sel.isCollapsed) {
    showToast('请先选中要添加评论的文字');
    return;
  }
  let node = sel.anchorNode;
  let editor = null;
  while (node) {
    if (node.classList?.contains('row-content')) { editor = node; break; }
    node = node.parentNode;
  }
  if (!editor) { showToast('请在编辑区内选择文字'); return; }

  const rowId = editor.id.replace('editor-', '');
  const commentId = 'c_' + generateId();
  const range = sel.getRangeAt(0);
  const text = range.toString();
  if (!text.trim()) { showToast('请选中要添加评论的文字'); return; }

  const marker = document.createElement('span');
  marker.className = 'comment-marker';
  marker.setAttribute('data-comment-id', commentId);
  marker.innerHTML = text + '<span class="comment-bubble">点击查看评论</span>';
  range.deleteContents();
  range.insertNode(marker);

  const film = getCurrentFilm();
  const row = film.rows.find(r => r.id === rowId);
  if (row) {
    row.comments = row.comments || [];
    row.content = editor.innerHTML;
    saveData();
  }

  currentCommentRowId = rowId;
  currentCommentMarkerId = commentId;
  document.getElementById('commentTextarea').value = '';
  renderCommentList([]);
  document.getElementById('commentModal').classList.add('show');
  document.getElementById('commentTextarea').focus();
}

function showCommentModal(commentId) {
  const film = getCurrentFilm();
  if (!film) return;
  for (const row of film.rows) {
    if (row.content && row.content.includes(commentId)) {
      currentCommentRowId = row.id;
      currentCommentMarkerId = commentId;
      const comments = (row.comments || []).filter(c => c.markerId === commentId);
      renderCommentList(comments);
      document.getElementById('commentTextarea').value = '';
      document.getElementById('commentModal').classList.add('show');
      return;
    }
  }
}

function renderCommentList(comments) {
  const panel = document.getElementById('commentListPanel');
  if (comments.length === 0) {
    panel.innerHTML = '<div style="text-align:center;color:var(--muted);padding:20px;">暂无评论</div>';
    return;
  }
  panel.innerHTML = comments.map(c => `
    <div class="comment-item">
      <div class="comment-meta"><span>${c.author || '匿名'}</span><span>${new Date(c.time).toLocaleString()}</span></div>
      <div>${c.text}</div>
    </div>
  `).join('');
}

function submitComment() {
  const text = document.getElementById('commentTextarea').value.trim();
  if (!text) { showToast('请输入评论内容'); return; }
  const film = getCurrentFilm();
  const row = film.rows.find(r => r.id === currentCommentRowId);
  if (!row) return;
  row.comments = row.comments || [];
  row.comments.push({
    id: generateId(),
    markerId: currentCommentMarkerId,
    text: text,
    author: '我',
    time: Date.now()
  });
  saveData();
  renderCommentList(row.comments.filter(c => c.markerId === currentCommentMarkerId));
  document.getElementById('commentTextarea').value = '';
  showToast('评论已添加');
}

// ==================== 面板开关与大小调节 ====================
function toggleRightPanel() {
  const sidebar = document.getElementById('sidebarRight');
  sidebar.classList.toggle('collapsed');
  const btn = sidebar.querySelector('.toggle-panel-btn');
  btn.textContent = sidebar.classList.contains('collapsed') ? '▶' : '◀';
}

function initResizers() {
  const leftResizer = document.getElementById('resizerLeft');
  const leftSidebar = document.getElementById('sidebarLeft');

  leftResizer.addEventListener('mousedown', function(e) {
    e.preventDefault();
    this.classList.add('active');
    const startX = e.clientX;
    const startWidth = leftSidebar.offsetWidth;
    function move(e) {
      const w = startWidth + (e.clientX - startX);
      if (w >= 200 && w <= 400) leftSidebar.style.width = w + 'px';
    }
    function up() {
      leftResizer.classList.remove('active');
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', up);
    }
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
  });

  const rightResizer = document.getElementById('resizerRight');
  const rightSidebar = document.getElementById('sidebarRight');

  rightResizer.addEventListener('mousedown', function(e) {
    e.preventDefault();
    if (rightSidebar.classList.contains('collapsed')) return;
    this.classList.add('active');
    const startX = e.clientX;
    const startWidth = rightSidebar.offsetWidth;
    function move(e) {
      const w = startWidth - (e.clientX - startX);
      if (w >= 200 && w <= 500) rightSidebar.style.width = w + 'px';
    }
    function up() {
      rightResizer.classList.remove('active');
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', up);
    }
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
  });
}

// ==================== 移动端 ====================
function toggleLeftSidebar() {
  const sidebar = document.getElementById('sidebarLeft');
  const overlay = document.getElementById('mobileOverlay');
  sidebar.classList.toggle('open');
  overlay.classList.toggle('show');
  document.getElementById('sidebarRight').classList.remove('open');
}

function toggleRightSidebar() {
  const sidebar = document.getElementById('sidebarRight');
  const overlay = document.getElementById('mobileOverlay');
  sidebar.classList.toggle('open');
  overlay.classList.toggle('show');
  document.getElementById('sidebarLeft').classList.remove('open');
  saveLayoutPrefs();
}

// ==================== 键盘快捷键 ====================
function handleKeydown(e) {
  if (e.ctrlKey && e.key === 'b') { e.preventDefault(); execCmd('bold'); }
  if (e.ctrlKey && e.key === 'i') { e.preventDefault(); execCmd('italic'); }
  if (e.ctrlKey && e.key === 'u') { e.preventDefault(); execCmd('underline'); }
  if (e.ctrlKey && e.key === 'z') { e.preventDefault(); execCmd('undo'); }
  if (e.ctrlKey && e.key === 'y') { e.preventDefault(); execCmd('redo'); }
  if (e.ctrlKey && (e.key === 's' || e.key === 'S')) { e.preventDefault(); manualSave(); }
}

// ==================== 模态框 ====================
function closeModal(modalId) {
  document.getElementById(modalId).classList.remove('show');
}

document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', function(e) {
    if (e.target === this) this.classList.remove('show');
  });
});

// ==================== 导入导出 ====================
function exportData() {
  const blob = new Blob([JSON.stringify(appData, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `拉片数据_${new Date().toLocaleDateString()}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('导出成功');
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (data.films && Array.isArray(data.films)) {
        if (confirm('导入将覆盖现有数据，确定继续吗？')) {
          appData = data;
          saveData();
          renderFilmList();
          renderRightPanel();
          showToast('导入成功');
        }
      } else { showToast('文件格式不正确'); }
    } catch(err) { showToast('文件解析失败'); }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// ==================== 保存与历史记录 ====================
function manualSave() {
  saveData();
  saveToHistory('手动保存');
  showToast('已保存');
  updateSaveStatus(true);
}

function autoSave() {
  saveData();
  saveToHistory('自动保存');
  updateSaveStatus(true);
}

function saveToHistory(saveType) {
  let history = [];
  try {
    const raw = localStorage.getItem(HISTORY_KEY);
    if (raw) history = JSON.parse(raw);
  } catch(e) {}

  const snapshot = {
    id: generateId(),
    timestamp: Date.now(),
    type: saveType,
    data: JSON.parse(JSON.stringify(appData))
  };

  history.unshift(snapshot);

  if (history.length > MAX_HISTORY) {
    history = history.slice(0, MAX_HISTORY);
  }

  try {
    localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
  } catch(e) {
    console.error('保存历史失败', e);
  }
}

function loadHistory() {
  try {
    const raw = localStorage.getItem(HISTORY_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return [];
}

function updateSaveStatus(flash) {
  const el = document.getElementById('saveStatus');
  if (!el) return;
  const history = loadHistory();
  if (history.length > 0) {
    const last = history[0];
    const time = new Date(last.timestamp);
    const timeStr = time.getHours().toString().padStart(2,'0') + ':' +
                     time.getMinutes().toString().padStart(2,'0') + ':' +
                     time.getSeconds().toString().padStart(2,'0');
    el.textContent = '上次保存: ' + timeStr;
    if (flash) {
      el.classList.remove('save-flash');
      void el.offsetWidth;
      el.classList.add('save-flash');
    }
  } else {
    el.textContent = '尚未保存';
  }
}

function openHistoryModal() {
  const history = loadHistory();
  const listEl = document.getElementById('historyList');

  if (history.length === 0) {
    listEl.innerHTML = '<div style="text-align:center;color:var(--muted);padding:40px;">暂无历史记录</div>';
  } else {
    listEl.innerHTML = history.map(function(h) {
      var time = new Date(h.timestamp);
      var timeStr = time.getFullYear() + '-' +
        (time.getMonth()+1).toString().padStart(2,'0') + '-' +
        time.getDate().toString().padStart(2,'0') + ' ' +
        time.getHours().toString().padStart(2,'0') + ':' +
        time.getMinutes().toString().padStart(2,'0') + ':' +
        time.getSeconds().toString().padStart(2,'0');
      var filmCount = h.data.films ? h.data.films.length : 0;
      var rowCount = 0;
      if (h.data.films) {
        h.data.films.forEach(function(f) {
          if (f.rows) rowCount += f.rows.length;
        });
      }
      return '<div class="history-item">' +
        '<div class="history-info">' +
          '<div class="history-time">' + timeStr + '</div>' +
          '<div class="history-detail">' + h.type + ' · ' + filmCount + '部影片 · ' + rowCount + '行</div>' +
        '</div>' +
        '<div class="history-actions">' +
          '<button class="btn btn-secondary" onclick="restoreHistory(\'' + h.id + '\')" style="font-size:12px;padding:4px 10px;">恢复</button>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  document.getElementById('historyModal').classList.add('show');
}

function restoreHistory(historyId) {
  var history = loadHistory();
  var item = history.find(function(h) { return h.id === historyId; });
  if (!item) {
    showToast('未找到该历史记录');
    return;
  }

  if (!confirm('恢复后将覆盖当前内容，确定继续吗？')) return;

  // 先保存当前状态到历史
  saveToHistory('恢复前自动保存');

  // 恢复数据
  appData = JSON.parse(JSON.stringify(item.data));
  saveData();
  renderFilmList();
  renderRightPanel();
  closeModal('historyModal');
  showToast('已恢复到: ' + new Date(item.timestamp).toLocaleString());
}

// ==================== Toast ====================
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

// ==================== WPS文档导入 ====================
function importWPSDocument(event) {
  const file = event.target.files[0];
  if (!file) return;

  const fileName = file.name;
  const ext = fileName.split('.').pop().toLowerCase();
  showToast('正在解析文档...');

  if (ext === 'docx') {
    var reader = new FileReader();
    reader.onload = function(e) {
      if (typeof mammoth === 'undefined') {
        showToast('文档解析库未加载，请检查网络');
        return;
      }
      mammoth.extractRawText({ arrayBuffer: e.target.result })
        .then(function(result) {
          var parsed = parseDocumentText(result.value, fileName);
          if (parsed) createFilmFromImport(parsed);
        })
        .catch(function(err) {
          showToast('文档解析失败: ' + err.message);
        });
    };
    reader.readAsArrayBuffer(file);
  } else if (ext === 'txt') {
    var reader2 = new FileReader();
    reader2.onload = function(e) {
      var parsed = parseDocumentText(e.target.result, fileName);
      if (parsed) createFilmFromImport(parsed);
    };
    reader2.readAsText(file, 'UTF-8');
  } else if (ext === 'doc') {
    var reader3 = new FileReader();
    reader3.onload = function(e) {
      var raw = e.target.result;
      var clean = raw.replace(/[^\u4e00-\u9fa5\u0020-\u007e\n\r\t]/g, ' ').replace(/[ \t]+/g, ' ').replace(/\n{3,}/g, '\n\n').trim();
      var parsed = parseDocumentText(clean, fileName);
      if (parsed) createFilmFromImport(parsed);
    };
    reader3.readAsText(file, 'GB18030');
  } else {
    showToast('不支持的格式，请用 .docx 或 .txt');
  }
  event.target.value = '';
}

function parseDocumentText(text, fileName) {
  if (!text || text.trim().length === 0) {
    showToast('文档内容为空');
    return null;
  }

  var lines = text.split(/\n/).map(function(l) { return l.trim(); }).filter(function(l) { return l.length > 0; });
  if (lines.length === 0) {
    showToast('文档内容为空');
    return null;
  }

  var filmName = '';
  var startIdx = 0;

  var numPatterns = [
    /^(\d+)\s*[.、）)\]:：]\s*(.*)/,
    /^[(（]\s*(\d+)\s*[)）]\s*(.*)/,
    /^第(\d+)\s*[条段章节部分]\s*(.*)/,
    /^(\d+)\s+(.*)/
  ];

  function matchNumbered(line) {
    for (var i = 0; i < numPatterns.length; i++) {
      var m = line.match(numPatterns[i]);
      if (m) return { num: parseInt(m[1]), rest: m[2] };
    }
    return null;
  }

  for (var i = 0; i < Math.min(5, lines.length); i++) {
    var nm = matchNumbered(lines[i]);
    if (nm) break;
    filmName += (filmName ? ' ' : '') + lines[i];
    startIdx = i + 1;
  }

  if (!filmName) filmName = fileName.replace(/\.(docx?|txt)$/i, '');

  var rows = [];
  var timeRegex = /(\d{1,2}:\d{2}(?::\d{2})?)/g;

  // 每行换行都创建新的序号行
  for (var i = startIdx; i < lines.length; i++) {
    var line = lines[i];
    var nm = matchNumbered(line);
    var content = nm ? nm.rest : line;

    var times = content.match(timeRegex);
    var startTime = '';
    var endTime = '';
    var textContent = content;

    if (times && times.length >= 1) {
      startTime = times[0];
      if (times.length >= 2) endTime = times[1];
      textContent = content.replace(timeRegex, '').replace(/^[\s\-–—~]+/, '').trim();
    }

    rows.push({
      id: generateId(),
      number: rows.length + 1,
      startTime: startTime,
      endTime: endTime,
      content: textContent ? '<p>' + textContent + '</p>' : '',
      eventId: null,
      comments: []
    });
  }

  if (rows.length === 0) {
    rows.push({
      id: generateId(),
      number: 1,
      startTime: '',
      endTime: '',
      content: '<p>' + lines.slice(startIdx).join('</p><p>') + '</p>',
      eventId: null,
      comments: []
    });
  }

  rows.forEach(function(r, i) { r.number = i + 1; });

  for (var i = 1; i < rows.length; i++) {
    if (!rows[i].startTime && rows[i-1].endTime) {
      rows[i].startTime = rows[i-1].endTime;
    }
  }

  return { name: filmName.trim(), rows: rows };
}

function createFilmFromImport(parsed) {
  var newFilm = {
    id: generateId(),
    name: parsed.name,
    rows: parsed.rows,
    events: [],
    plotSummary: '',
    characters: '',
    theme: ''
  };

  appData.films.unshift(newFilm);
  appData.currentFilmId = newFilm.id;
  saveData();
  renderFilmList();
  showToast('已导入: ' + parsed.name + ' (' + parsed.rows.length + '行)');
}

// 读取本地存储的背景图
var savedBg = localStorage.getItem('xfy_workshop_bg');
if (savedBg) {
  document.body.style.backgroundImage = 'url(' + savedBg + ')';
  document.body.style.backgroundSize = 'cover';
  document.body.style.backgroundPosition = 'center';
  document.body.style.backgroundAttachment = 'fixed';
}

applyPageTheme();
window.parent.postMessage({ type: 'ready' }, '*');

function applyPageTheme() {
  var mode = localStorage.getItem('xfy_theme_mode') || 'light';
  var root = document.documentElement;
  if (mode === 'dark') {
    root.style.setProperty('--bg', '#0a0e1a');
    root.style.setProperty('--bg2', '#1c2333');
    root.style.setProperty('--bg3', '#131826');
    root.style.setProperty('--ink', '#e8edf5');
    root.style.setProperty('--muted', '#8a96b0');
    root.style.setProperty('--rule', '#2a3344');
    root.style.setProperty('--glass', 'rgba(28,35,51,0.55)');
  } else {
    root.style.setProperty('--bg', '#f5f6f8');
    root.style.setProperty('--bg2', '#ffffff');
    root.style.setProperty('--bg3', '#f0f2f5');
    root.style.setProperty('--ink', '#1a1a2e');
    root.style.setProperty('--muted', '#6b7280');
    root.style.setProperty('--rule', '#e5e7eb');
    root.style.setProperty('--glass', 'rgba(255,255,255,0.75)');
  }
}

// 监听父窗口消息
window.addEventListener('message', function(e) {
  if (e.data.type === 'setBg') {
    document.body.style.backgroundImage = 'url(' + e.data.bg + ')';
    document.body.style.backgroundSize = 'cover';
    document.body.style.backgroundPosition = 'center';
    document.body.style.backgroundAttachment = 'fixed';
  } else if (e.data.type === 'clearBg') {
    document.body.style.backgroundImage = '';
    document.body.style.backgroundSize = '';
    document.body.style.backgroundAttachment = '';
  } else if (e.data.type === 'theme') {
    if (e.data.mode) localStorage.setItem('xfy_theme_mode', e.data.mode);
    applyPageTheme();
  }
});
