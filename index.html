<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>XFY工作坊</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #0a0e1a;
      color: #e8edf5;
      overflow: hidden;
      height: 100vh;
    }
    .top-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 52px;
      background: rgba(19, 24, 38, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(91, 141, 239, 0.15);
      padding: 0 20px;
      position: relative;
      z-index: 100;
      flex-shrink: 0;
    }
    .nav-brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .brand-title {
      font-size: 18px;
      font-weight: 700;
      color: #5b8def;
      letter-spacing: 1px;
      white-space: nowrap;
    }
    .nav-tabs {
      display: flex;
      gap: 2px;
      flex: 1;
      justify-content: center;
    }
    .nav-tab {
      padding: 8px 20px;
      font-size: 14px;
      font-weight: 500;
      color: #8a96b0;
      background: transparent;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .nav-tab:hover { color: #e8edf5; background: rgba(91, 141, 239, 0.08); }
    .nav-tab.active {
      color: #e8edf5;
      background: rgba(91, 141, 239, 0.15);
    }
    .nav-right {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .nav-btn {
      padding: 6px 14px;
      font-size: 13px;
      color: #8a96b0;
      background: rgba(28, 35, 51, 0.6);
      border: 1px solid rgba(91, 141, 239, 0.1);
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .nav-btn:hover { color: #e8edf5; border-color: rgba(91, 141, 239, 0.3); }
    .app-container {
      width: 100%;
      height: calc(100vh - 52px);
      position: relative;
    }
    .app-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: none;
    }
    .app-frame.active { display: block; }

    /* 设置弹窗 */
    .settings-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .settings-overlay.show { display: flex; }
    .settings-box {
      background: #131826;
      border: 1px solid rgba(91, 141, 239, 0.2);
      border-radius: 12px;
      padding: 24px;
      width: 420px;
      max-width: 90vw;
    }
    .settings-box h2 { margin-bottom: 16px; font-size: 18px; }
    .settings-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid rgba(91, 141, 239, 0.08);
    }
    .settings-item:last-child { border-bottom: none; }
    .settings-label { font-size: 14px; color: #e8edf5; }
    .settings-desc { font-size: 12px; color: #8a96b0; margin-top: 2px; }
    .toggle-switch {
      position: relative;
      width: 40px;
      height: 22px;
      background: #2a3245;
      border-radius: 11px;
      cursor: pointer;
      transition: background 0.2s;
      flex-shrink: 0;
    }
    .toggle-switch.on { background: #5b8def; }
    .toggle-switch::after {
      content: '';
      position: absolute;
      top: 2px; left: 2px;
      width: 18px; height: 18px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
    }
    .toggle-switch.on::after { transform: translateX(18px); }
    .settings-actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
      justify-content: flex-end;
    }
    .settings-btn {
      padding: 8px 20px;
      font-size: 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .settings-btn-primary { background: #5b8def; color: #fff; }
    .settings-btn-secondary { background: #2a3245; color: #8a96b0; }

    @media (max-width: 600px) {
      .brand-title { font-size: 15px; }
      .nav-tab { padding: 6px 12px; font-size: 13px; }
      .nav-btn { padding: 5px 10px; font-size: 12px; }
    }
  </style>
</head>
<body>
  <div class="top-nav">
    <div class="nav-brand">
      <span class="brand-title">XFY工作坊</span>
    </div>
    <div class="nav-tabs">
      <button class="nav-tab active" data-app="ai" onclick="switchApp('ai')">AI短片创作</button>
      <button class="nav-tab" data-app="lapian" onclick="switchApp('lapian')">剧作-xfy的拉片笔记</button>
    </div>
    <div class="nav-right">
      <button class="nav-btn" onclick="openSettings()">⚙️ 设置</button>
    </div>
  </div>

  <div class="app-container">
    <iframe class="app-frame active" id="app-ai" src="ai-platform.html"></iframe>
    <iframe class="app-frame" id="app-lapian" src="lapian.html"></iframe>
  </div>

  <!-- 设置弹窗 -->
  <div class="settings-overlay" id="settingsOverlay">
    <div class="settings-box">
      <h2>⚙️ 平台设置</h2>
      <div class="settings-item">
        <div>
          <div class="settings-label">固定布局设置</div>
          <div class="settings-desc">刷新后保持当前窗口布局</div>
        </div>
        <div class="toggle-switch on" id="toggleLayout" onclick="this.classList.toggle('on')"></div>
      </div>
      <div class="settings-item">
        <div>
          <div class="settings-label">自动保存（3分钟）</div>
          <div class="settings-desc">拉片笔记自动保存并保留最近10次历史</div>
        </div>
        <div class="toggle-switch on" id="toggleAutosave" onclick="this.classList.toggle('on')"></div>
      </div>
      <div class="settings-item">
        <div>
          <div class="settings-label">记住当前页面</div>
          <div class="settings-desc">刷新后保持上次打开的页面</div>
        </div>
        <div class="toggle-switch on" id="toggleRememberPage" onclick="this.classList.toggle('on')"></div>
      </div>
      <div class="settings-actions">
        <button class="settings-btn settings-btn-secondary" onclick="closeSettings()">关闭</button>
        <button class="settings-btn settings-btn-primary" onclick="saveSettings()">保存</button>
      </div>
    </div>
  </div>

  <script>
    const LAYOUT_KEY = 'xfy_workshop_settings';

    function loadSettings() {
      try {
        const raw = localStorage.getItem(LAYOUT_KEY);
        if (raw) return JSON.parse(raw);
      } catch(e) {}
      return { activeApp: 'ai', lockLayout: true, autosave: true, rememberPage: true };
    }

    function saveSettingsData(data) {
      localStorage.setItem(LAYOUT_KEY, JSON.stringify(data));
    }

    function switchApp(app) {
      document.querySelectorAll('.nav-tab').forEach(tab => {
        tab.classList.toggle('active', tab.dataset.app === app);
      });
      document.querySelectorAll('.app-frame').forEach(frame => {
        frame.classList.toggle('active', frame.id === 'app-' + app);
      });
      const settings = loadSettings();
      if (settings.rememberPage) {
        settings.activeApp = app;
        saveSettingsData(settings);
      }
    }

    function openSettings() {
      const settings = loadSettings();
      document.getElementById('toggleLayout').classList.toggle('on', settings.lockLayout);
      document.getElementById('toggleAutosave').classList.toggle('on', settings.autosave);
      document.getElementById('toggleRememberPage').classList.toggle('on', settings.rememberPage);
      document.getElementById('settingsOverlay').classList.add('show');
    }

    function closeSettings() {
      document.getElementById('settingsOverlay').classList.remove('show');
    }

    function saveSettings() {
      const settings = {
        lockLayout: document.getElementById('toggleLayout').classList.contains('on'),
        autosave: document.getElementById('toggleAutosave').classList.contains('on'),
        rememberPage: document.getElementById('toggleRememberPage').classList.contains('on'),
        activeApp: loadSettings().activeApp || 'ai'
      };
      saveSettingsData(settings);
      closeSettings();
    }

    // 初始化
    const settings = loadSettings();
    if (settings.activeApp) switchApp(settings.activeApp);
  </script>
</body>
</html>
