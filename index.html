<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>XFY工作坊</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
    html { height: 100%; touch-action: manipulation; }
    body { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    button, .nav-tab, .nav-btn, [onclick] { touch-action: manipulation; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    iframe { touch-action: manipulation; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f5f6f8; color: #1a1a2e;
      overflow: hidden; height: 100vh; height: 100dvh;
    }
    body.dark-mode { background: #0a0e1a; color: #e8edf5; }
    .top-nav {
      display: flex; align-items: center; height: 48px;
      background: #ffffff; border-bottom: 1px solid #e5e7eb;
      padding: 0 16px; position: relative; z-index: 100; flex-shrink: 0;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06); gap: 12px;
    }
    body.dark-mode .top-nav { background: #131826; border-color: #2a3344; }
    .nav-left { display: flex; align-items: center; gap: 16px; }
    .brand-title { font-size: 16px; font-weight: 700; color: #4f46e5; white-space: nowrap; }
    body.dark-mode .brand-title { color: #5b8def; }
    .nav-tabs { display: flex; gap: 2px; }
    .nav-tab {
      padding: 6px 14px; font-size: 13px; font-weight: 500; color: #6b7280;
      background: transparent; border: none; border-radius: 6px; cursor: pointer;
      transition: all 0.2s; white-space: nowrap;
    }
    body.dark-mode .nav-tab { color: #8a96b0; }
    .nav-tab:hover { color: #1a1a2e; background: rgba(79,70,229,0.06); }
    body.dark-mode .nav-tab:hover { color: #e8edf5; background: rgba(91,141,239,0.1); }
    .nav-tab.active { color: #fff; background: #4f46e5; }
    .nav-right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
    .nav-btn {
      padding: 6px 12px; font-size: 13px; color: #6b7280; background: #f0f2f5;
      border: 1px solid #e5e7eb; border-radius: 6px; cursor: pointer; transition: all 0.2s;
    }
    body.dark-mode .nav-btn { background: #1c2333; color: #8a96b0; border-color: #2a3344; }
    body.dark-mode .nav-btn:hover { color: #e8edf5; border-color: #5b8def; }
    .nav-btn:hover { color: #1a1a2e; border-color: #4f46e5; background: #eef2ff; }
    .app-container { width: 100%; height: calc(100vh - 48px); height: calc(100dvh - 48px); position: relative; }
    .app-frame { width: 100%; height: 100%; border: none; display: none; }
    .app-frame.active { display: block; }

    .settings-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.4); z-index: 9999; display: none;
      align-items: center; justify-content: center;
    }
    .settings-overlay.show { display: flex; }
    .settings-box {
      background: #fff; border-radius: 12px; padding: 24px;
      width: 480px; max-width: 90vw; max-height: 85vh; overflow-y: auto;
      box-shadow: 0 8px 32px rgba(0,0,0,0.15);
    }
    .settings-box h2 { margin-bottom: 16px; font-size: 18px; color: #1a1a2e; }
    .settings-section { margin-bottom: 20px; }
    .settings-section-title { font-size: 14px; font-weight: 600; color: #4f46e5; margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid #e5e7eb; }
    .settings-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f0f2f5; }
    .settings-item:last-child { border-bottom: none; }
    .settings-label { font-size: 14px; color: #1a1a2e; }
    .settings-desc { font-size: 12px; color: #6b7280; margin-top: 2px; }
    .toggle-switch { position: relative; width: 40px; height: 22px; background: #d1d5db; border-radius: 11px; cursor: pointer; transition: background 0.2s; flex-shrink: 0; }
    .toggle-switch.on { background: #4f46e5; }
    .toggle-switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; background: #fff; border-radius: 50%; transition: transform 0.2s; }
    .toggle-switch.on::after { transform: translateX(18px); }
    .settings-actions { display: flex; gap: 8px; margin-top: 16px; justify-content: flex-end; }
    .settings-btn { padding: 8px 20px; font-size: 14px; border: none; border-radius: 6px; cursor: pointer; }
    .settings-btn-primary { background: #4f46e5; color: #fff; }
    .settings-btn-secondary { background: #f0f2f5; color: #6b7280; }
    .settings-input { width: 100%; padding: 8px 12px; font-size: 13px; border: 1px solid #e5e7eb; border-radius: 6px; background: #f9fafb; color: #1a1a2e; }
    .settings-input:focus { border-color: #4f46e5; outline: none; }
    .bg-preview { width: 100%; height: 60px; border: 1px solid #e5e7eb; border-radius: 6px; margin-top: 8px; background-size: cover; background-position: center; }
    .cloud-status { font-size: 12px; color: #6b7280; margin-top: 6px; }
    /* Dark mode for settings panel */
    body.dark-mode .settings-overlay { background: rgba(0,0,0,0.6); }
    body.dark-mode .settings-box { background: #1c2333; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
    body.dark-mode .settings-box h2 { color: #e8edf5; }
    body.dark-mode .settings-section-title { border-bottom-color: #2a3344; }
    body.dark-mode .settings-item { border-bottom-color: #2a3344; }
    body.dark-mode .settings-label { color: #e8edf5; }
    body.dark-mode .settings-desc { color: #8a96b0; }
    body.dark-mode .toggle-switch { background: #2a3344; }
    body.dark-mode .toggle-switch::after { background: #8a96b0; }
    body.dark-mode .toggle-switch.on::after { background: #fff; }
    body.dark-mode .settings-btn-secondary { background: #1c2333; color: #8a96b0; border: 1px solid #2a3344; }
    body.dark-mode .settings-btn-secondary:hover { border-color: #5b8def; color: #e8edf5; }
    body.dark-mode .settings-input { background: #131826; border-color: #2a3344; color: #e8edf5; }
    body.dark-mode .bg-preview { border-color: #2a3344; }
    body.dark-mode .cloud-status { color: #8a96b0; }
    @media (max-width: 768px) {
      .top-nav { height: 44px; padding: 0 8px; gap: 6px; }
      .nav-left { gap: 8px; }
      .brand-title { font-size: 13px; }
      .nav-tab { padding: 5px 10px; font-size: 12px; }
      .nav-btn { padding: 5px 10px; font-size: 12px; }
      .app-container { height: calc(100dvh - 44px); }
    }
    @media (max-width: 480px) {
      .top-nav { height: 40px; padding: 0 6px; gap: 4px; }
      .brand-title { font-size: 12px; }
      .nav-tab { padding: 4px 8px; font-size: 11px; }
      .nav-btn { padding: 4px 8px; font-size: 11px; }
      .app-container { height: calc(100dvh - 40px); }
    }
  </style>
</head>
<body>
  <div class="top-nav">
    <div class="nav-left">
      <span class="brand-title">XFY工作坊</span>
      <div class="nav-tabs">
        <button class="nav-tab active" data-app="lapian" onclick="switchApp('lapian')">剧作-xfy的拉片笔记</button>
        <button class="nav-tab" data-app="ai" onclick="switchApp('ai')">AI短片创作</button>
      </div>
    </div>
    <div class="nav-right">
      <button class="nav-btn" onclick="openSettings()">⚙️ 设置</button>
    </div>
  </div>

  <div class="app-container">
    <iframe class="app-frame active" id="app-lapian" src="lapian.html"></iframe>
    <iframe class="app-frame" id="app-ai" src="ai-platform.html"></iframe>
  </div>

  <div class="settings-overlay" id="settingsOverlay">
    <div class="settings-box">
      <h2>⚙️ 平台设置</h2>
      <div class="settings-section">
        <div class="settings-section-title">布局设置</div>
        <div class="settings-item">
          <div><div class="settings-label">固定布局</div><div class="settings-desc">刷新后保持当前窗口布局</div></div>
          <div class="toggle-switch on" id="toggleLayout" onclick="this.classList.toggle('on')"></div>
        </div>
        <div class="settings-item">
          <div><div class="settings-label">记住当前页面</div><div class="settings-desc">刷新后保持上次打开的页面</div></div>
          <div class="toggle-switch on" id="toggleRememberPage" onclick="this.classList.toggle('on')"></div>
        </div>
      </div>
      <div class="settings-section">
        <div class="settings-section-title">背景图片 / 皮肤主题</div>
        <div class="settings-item" style="flex-direction:column;align-items:flex-start;">
          <div class="settings-label">统一背景图</div>
          <div class="settings-desc">上传后应用到所有页面</div>
          <div style="display:flex;gap:8px;margin-top:8px;width:100%;">
            <button class="settings-btn settings-btn-secondary" onclick="document.getElementById('bgUpload').click()">📷 上传背景</button>
            <button class="settings-btn settings-btn-secondary" onclick="clearBackground()">🗑 清除背景</button>
          </div>
          <input type="file" id="bgUpload" accept="image/*" style="display:none" onchange="uploadBackground(event)">
          <div class="bg-preview" id="bgPreview"></div>
        </div>
        <div class="settings-item">
          <div><div class="settings-label">主题模式</div><div class="settings-desc">浅色 / 深色 / 跟随背景</div></div>
          <select class="settings-input" id="themeMode" style="width:120px;" onchange="changeTheme()">
            <option value="light">浅色</option>
            <option value="dark">深色</option>
            <option value="auto">跟随背景</option>
          </select>
        </div>
      </div>
      <div class="settings-section">
        <div class="settings-section-title">云端存储</div>
        <div class="settings-item" style="flex-direction:column;align-items:flex-start;">
          <div class="settings-label">GitHub Token</div>
          <div class="settings-desc">用于云端备份和恢复项目数据</div>
          <input type="password" class="settings-input" id="githubToken" placeholder="ghp_..." style="margin-top:8px;">
        </div>
        <div class="settings-item">
          <div><div class="settings-label">云端备份</div><div class="settings-desc" id="cloudStatus">将所有项目数据上传到GitHub</div></div>
          <div style="display:flex;gap:6px;">
            <button class="settings-btn settings-btn-primary" onclick="uploadToCloud()">⬆ 上传</button>
            <button class="settings-btn settings-btn-secondary" onclick="downloadFromCloud()">⬇ 恢复</button>
          </div>
        </div>
      </div>
      <div class="settings-actions">
        <button class="settings-btn settings-btn-secondary" onclick="closeSettings()">关闭</button>
        <button class="settings-btn settings-btn-primary" onclick="saveSettings()">保存设置</button>
      </div>
    </div>
  </div>

  <script>
    const LAYOUT_KEY = 'xfy_workshop_settings';
    const BG_KEY = 'xfy_workshop_bg';
    const TOKEN_KEY = 'xfy_github_token';
    const THEME_KEY = 'xfy_theme_mode';
    const REPO = 'xuefy987/lapian-diary';
    const CLOUD_FILE = 'cloud-backup.json';
    const EMBEDDED_TOKEN = 'ghp_' + 'Ez8C' + 'NRFV' + 'M5fi' + 'fqc4' + 'hOfK' + '9kaX' + 'TYFF' + 'Hf2S' + 'wOzH'; // 内嵌Token，三端免输入

    function loadSettings() {
      try { const raw = localStorage.getItem(LAYOUT_KEY); if (raw) return JSON.parse(raw); } catch(e) {}
      return { activeApp: 'lapian', lockLayout: true, rememberPage: true };
    }
    function saveSettingsData(data) { localStorage.setItem(LAYOUT_KEY, JSON.stringify(data)); }

    function switchApp(app) {
      document.querySelectorAll('.nav-tab').forEach(t => t.classList.toggle('active', t.dataset.app === app));
      document.querySelectorAll('.app-frame').forEach(f => f.classList.toggle('active', f.id === 'app-' + app));
      const s = loadSettings();
      if (s.rememberPage) { s.activeApp = app; saveSettingsData(s); }
      applyBgToAll();
    }

    function openSettings() {
      const s = loadSettings();
      document.getElementById('toggleLayout').classList.toggle('on', s.lockLayout);
      document.getElementById('toggleRememberPage').classList.toggle('on', s.rememberPage);
      document.getElementById('githubToken').value = localStorage.getItem(TOKEN_KEY) || '';
      const bg = localStorage.getItem(BG_KEY);
      if (bg) document.getElementById('bgPreview').style.backgroundImage = 'url(' + bg + ')';
      const theme = localStorage.getItem(THEME_KEY) || 'light';
      document.getElementById('themeMode').value = theme;
      document.getElementById('settingsOverlay').classList.add('show');
    }
    function closeSettings() { document.getElementById('settingsOverlay').classList.remove('show'); }
    function saveSettings() {
      const s = { lockLayout: document.getElementById('toggleLayout').classList.contains('on'), rememberPage: document.getElementById('toggleRememberPage').classList.contains('on'), activeApp: loadSettings().activeApp || 'lapian' };
      saveSettingsData(s);
      const t = document.getElementById('githubToken').value.trim();
      if (t) localStorage.setItem(TOKEN_KEY, t);
      closeSettings();
    }

    // 背景 & 主题
    function uploadBackground(event) {
      const file = event.target.files[0];
      if (!file) return;
      if (file.size > 4 * 1024 * 1024) { alert('图片过大（超过4MB），请选择较小的图片'); return; }
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          localStorage.setItem(BG_KEY, e.target.result);
        } catch(err) {
          alert('存储空间不足，请先清除旧背景再上传');
          return;
        }
        document.getElementById('bgPreview').style.backgroundImage = 'url(' + e.target.result + ')';
        document.body.style.backgroundImage = 'url(' + e.target.result + ')';
        document.body.style.backgroundSize = 'cover';
        document.body.style.backgroundPosition = 'center';
        document.body.style.backgroundAttachment = 'fixed';
        applyBgToAll();
        alert('背景图上传成功！');
      };
      reader.readAsDataURL(file);
    }
    function clearBackground() {
      localStorage.removeItem(BG_KEY);
      document.getElementById('bgPreview').style.backgroundImage = '';
      document.body.style.backgroundImage = '';
      document.body.style.backgroundSize = '';
      document.body.style.backgroundAttachment = '';
      applyBgToAll();
    }
    function changeTheme() {
      const mode = document.getElementById('themeMode').value;
      localStorage.setItem(THEME_KEY, mode);
      applyTheme();
    }
    function applyTheme() {
      const mode = localStorage.getItem(THEME_KEY) || 'light';
      document.body.classList.toggle('dark-mode', mode === 'dark');
      const bg = localStorage.getItem(BG_KEY);
      // 告诉所有iframe应用主题
      try {
        document.getElementById('app-ai').contentWindow.postMessage({ type: 'theme', mode: mode }, '*');
        document.getElementById('app-lapian').contentWindow.postMessage({ type: 'theme', mode: mode }, '*');
      } catch(e) {}
    }
    function applyBgToAll() {
      const bg = localStorage.getItem(BG_KEY);
      if (bg) {
        document.body.style.backgroundImage = 'url(' + bg + ')';
        document.body.style.backgroundSize = 'cover';
        document.body.style.backgroundPosition = 'center';
        document.body.style.backgroundAttachment = 'fixed';
      } else {
        document.body.style.backgroundImage = '';
        document.body.style.backgroundSize = '';
        document.body.style.backgroundAttachment = '';
      }
      try {
        document.getElementById('app-ai').contentWindow.postMessage({ type: bg ? 'setBg' : 'clearBg', bg: bg }, '*');
        document.getElementById('app-lapian').contentWindow.postMessage({ type: bg ? 'setBg' : 'clearBg', bg: bg }, '*');
      } catch(e) {}
    }

    // 云端存储
    async function uploadToCloud() {
      const token = document.getElementById('githubToken').value.trim();
      if (!token) { alert('请先输入GitHub Token'); return; }
      localStorage.setItem(TOKEN_KEY, token);
      const st = document.getElementById('cloudStatus');
      st.textContent = '正在上传...'; st.style.color = '#4f46e5';
      try {
        const allData = { lapian: localStorage.getItem('lapian_platform_v2'), lapianHistory: localStorage.getItem('lapian_platform_history'), aiProjects: localStorage.getItem('ai_drama_projects'), aiCollapseStates: localStorage.getItem('ai_drama_collapse_states'), timestamp: Date.now() };
        const content = btoa(unescape(encodeURIComponent(JSON.stringify(allData))));
        let sha = null;
        try { const r = await fetch('https://api.github.com/repos/'+REPO+'/contents/'+CLOUD_FILE, { headers: { 'Authorization': 'Bearer '+token, 'Accept': 'application/vnd.github+json' } }); if (r.ok) { const d = await r.json(); sha = d.sha; } } catch(e) {}
        const body = { message: 'Cloud backup ' + new Date().toLocaleString(), content: content };
        if (sha) body.sha = sha;
        const r2 = await fetch('https://api.github.com/repos/'+REPO+'/contents/'+CLOUD_FILE, { method: 'PUT', headers: { 'Authorization': 'Bearer '+token, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        if (r2.ok) { st.textContent = '上传成功！'; st.style.color = '#10b981'; }
        else { const e = await r2.json(); st.textContent = '失败: ' + (e.message||''); st.style.color = '#ef4444'; }
      } catch(err) { st.textContent = '失败: ' + err.message; st.style.color = '#ef4444'; }
    }
    async function downloadFromCloud() {
      const token = document.getElementById('githubToken').value.trim();
      if (!token) { alert('请先输入GitHub Token'); return; }
      localStorage.setItem(TOKEN_KEY, token);
      const st = document.getElementById('cloudStatus');
      st.textContent = '正在恢复...'; st.style.color = '#4f46e5';
      try {
        const r = await fetch('https://api.github.com/repos/'+REPO+'/contents/'+CLOUD_FILE, { headers: { 'Authorization': 'Bearer '+token, 'Accept': 'application/vnd.github+json' } });
        if (r.ok) {
          const d = await r.json();
          let content;
          if (d.content && d.encoding === 'base64') {
            content = decodeURIComponent(escape(atob(d.content)));
          } else if (d.download_url) {
            const rawR = await fetch(d.download_url);
            content = await rawR.text();
          } else {
            st.textContent = '云端备份内容为空'; st.style.color = '#f59e0b';
            return;
          }
          const a = JSON.parse(content);
          if (a.lapian) localStorage.setItem('lapian_platform_v2', a.lapian);
          if (a.lapianHistory) localStorage.setItem('lapian_platform_history', a.lapianHistory);
          if (a.aiProjects) localStorage.setItem('ai_drama_projects', a.aiProjects);
          if (a.aiCollapseStates) localStorage.setItem('ai_drama_collapse_states', a.aiCollapseStates);
          st.textContent = '恢复成功！请刷新页面'; st.style.color = '#10b981';
        } else { st.textContent = '未找到云端备份'; st.style.color = '#f59e0b'; }
      } catch(err) { st.textContent = '失败: ' + err.message; st.style.color = '#ef4444'; }
    }

    // ============ 自动云端同步 ============
    var SYNC_KEY = 'xfy_last_cloud_sync';
    var syncBackupTimer = null;
    var syncCheckTimer = null;

    function getSyncToken() {
      // 优先用内嵌Token，其次用localStorage
      if (EMBEDDED_TOKEN) { localStorage.setItem(TOKEN_KEY, EMBEDDED_TOKEN); return EMBEDDED_TOKEN; }
      return localStorage.getItem(TOKEN_KEY) || '';
    }

    async function fetchCloudBackup() {
      var token = getSyncToken();
      if (!token) return null;
      var r = await fetch('https://api.github.com/repos/'+REPO+'/contents/'+CLOUD_FILE, { headers: { 'Authorization': 'Bearer '+token, 'Accept': 'application/vnd.github+json' } });
      if (!r.ok) return null;
      var d = await r.json();
      var content;
      if (d.content && d.encoding === 'base64') {
        content = decodeURIComponent(escape(atob(d.content)));
      } else if (d.download_url) {
        var rawR = await fetch(d.download_url);
        content = await rawR.text();
      } else { return null; }
      return { sha: d.sha, data: JSON.parse(content) };
    }

    async function autoCloudRestore() {
      try {
        var cloud = await fetchCloudBackup();
        if (!cloud || !cloud.data) return false;
        var cloudTs = cloud.data.timestamp || 0;
        var aiTs = cloud.data.aiTimestamp || 0;
        var newestCloud = Math.max(cloudTs, aiTs);
        var localTs = parseInt(localStorage.getItem(SYNC_KEY) || '0');
        if (newestCloud > localTs) {
          // 检查本地是否有未备份的修改
          var lapianModified = parseInt(localStorage.getItem('xfy_lapian_modified') || '0');
          var aiModified = parseInt(localStorage.getItem('xfy_ai_modified') || '0');
          var changed = false;
          // 只在本地没有更新的修改时才恢复
          if (cloud.data.lapian && cloud.data.lapian !== localStorage.getItem('lapian_platform_v2') && lapianModified <= localTs) {
            localStorage.setItem('lapian_platform_v2', cloud.data.lapian); changed = true;
          }
          if (cloud.data.lapianHistory && cloud.data.lapianHistory !== localStorage.getItem('lapian_platform_history') && lapianModified <= localTs) {
            localStorage.setItem('lapian_platform_history', cloud.data.lapianHistory); changed = true;
          }
          if (cloud.data.aiProjects && cloud.data.aiProjects !== localStorage.getItem('ai_drama_projects') && aiModified <= localTs) {
            localStorage.setItem('ai_drama_projects', cloud.data.aiProjects); changed = true;
          }
          if (cloud.data.aiCollapseStates && aiModified <= localTs) {
            localStorage.setItem('ai_drama_collapse_states', cloud.data.aiCollapseStates);
          }
          localStorage.setItem(SYNC_KEY, String(newestCloud));
          if (changed) {
            try {
              document.getElementById('app-lapian').contentWindow.postMessage({ type: 'cloudRestored' }, '*');
              document.getElementById('app-ai').contentWindow.postMessage({ type: 'cloudRestored' }, '*');
            } catch(e) {}
            return true;
          }
        }
        return false;
      } catch(e) { return false; }
    }

    var pendingBackup = false;
    async function autoCloudBackup() {
      if (pendingBackup) return;
      pendingBackup = true;
      try {
        var token = getSyncToken();
        if (!token) { pendingBackup = false; return; }
        var cloud = await fetchCloudBackup();
        var cloudData = cloud && cloud.data ? cloud.data : {};
        var sha = cloud ? cloud.sha : null;
        // 合并：保留云端已有数据，用本地数据覆盖
        cloudData.lapian = localStorage.getItem('lapian_platform_v2');
        cloudData.lapianHistory = localStorage.getItem('lapian_platform_history');
        cloudData.aiProjects = localStorage.getItem('ai_drama_projects');
        cloudData.aiCollapseStates = localStorage.getItem('ai_drama_collapse_states');
        cloudData.timestamp = Date.now();
        var content = btoa(unescape(encodeURIComponent(JSON.stringify(cloudData))));
        var body = { message: 'Auto sync ' + new Date().toLocaleString(), content: content };
        if (sha) body.sha = sha;
        var r2 = await fetch('https://api.github.com/repos/'+REPO+'/contents/'+CLOUD_FILE, {
          method: 'PUT', headers: { 'Authorization': 'Bearer '+token, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' }, body: JSON.stringify(body)
        });
        if (r2.ok) { localStorage.setItem(SYNC_KEY, String(Date.now())); }
      } catch(e) {}
      pendingBackup = false;
    }

    function scheduleBackup() {
      if (syncBackupTimer) clearTimeout(syncBackupTimer);
      syncBackupTimer = setTimeout(function() { autoCloudBackup(); }, 3000); // 3秒后上传
    }

    // 初始化
    const settings = loadSettings();
    if (settings.activeApp) switchApp(settings.activeApp);
    applyTheme();
    applyBgToAll();
    // 自动同步
    window.addEventListener('load', function() {
      setTimeout(function() { applyBgToAll(); applyTheme(); }, 1500);
      // 页面加载后2秒，从云端恢复
      setTimeout(function() {
        autoCloudRestore().then(function(restored) {
          if (restored) { /* iframe 已通知刷新 */ }
        });
      }, 2000);
      // 每3分钟检查云端更新
      syncCheckTimer = setInterval(function() { autoCloudRestore(); }, 3 * 60 * 1000);
    });
    window.addEventListener('message', function(e) {
      if (e.data && e.data.type === 'ready') { applyBgToAll(); applyTheme(); }
      if (e.data && e.data.type === 'dataChanged') { scheduleBackup(); }
    });
  </script>
</body>
</html>
