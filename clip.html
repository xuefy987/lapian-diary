<html lang="zh-CN" data-theme="light" data-trae-theme="light" class=""><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>片段拉片 - XFY工作坊</title>
<style>
  :root {
    --bg: #f5f6f8;
    --bg2: #ffffff;
    --bg3: #f0f2f5;
    --ink: #1a1a2e;
    --muted: #6b7280;
    --rule: #e5e7eb;
    --accent: #4f46e5;
    --accent2: #06b6d4;
    --accent-light: #eef2ff;
    --danger: #ef4444;
    --success: #10b981;
    --warning: #f59e0b;
    --shadow: 0 2px 8px rgba(0,0,0,0.08);
    --shadow-lg: 0 4px 16px rgba(0,0,0,0.12);
  }
  :root[data-theme="dark"] {
    --bg: #0f1419; --bg2: #1a1f2e; --bg3: #242b3d;
    --ink: #f0f2f5; --muted: #9ca3af; --rule: #374151;
    --accent: #818cf8; --accent2: #22d3ee;
    --accent-light: rgba(129,140,248,0.2);
    --shadow: 0 2px 8px rgba(0,0,0,0.4);
    --shadow-lg: 0 4px 16px rgba(0,0,0,0.5);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--ink);
    overflow: hidden; font-size: 14px; line-height: 1.6;
  }
  .app-container { display: flex; height: 100%; width: 100%; }

  /* 左侧片段栏 */
  .sidebar-left {
    width: 260px; min-width: 200px; max-width: 400px;
    background: var(--bg2); border-right: 1px solid var(--rule);
    display: flex; flex-direction: column; flex-shrink: 0;
    transition: width 0.25s; overflow: hidden;
  }
  .sidebar-left.collapsed { width: 0 !important; min-width: 0 !important; border-right: none; }
  .sidebar-header { padding: 12px 16px; border-bottom: 1px solid var(--rule); display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .sidebar-title { font-size: 15px; font-weight: 700; color: var(--accent); }
  .sidebar-actions { display: flex; gap: 4px; }
  .icon-btn {
    width: 28px; height: 28px; border: 1px solid var(--rule); background: var(--bg);
    color: var(--ink); border-radius: 6px; cursor: pointer; font-size: 14px;
    display: flex; align-items: center; justify-content: center; transition: 0.15s;
  }
  .icon-btn:hover { background: var(--accent-light); border-color: var(--accent); }
  .sidebar-left.collapsed + .toggle-left-btn { display: block; }

  .clip-tree { flex: 1; overflow-y: auto; padding: 8px; }

  .folder-block { margin-bottom: 6px; }
  .folder-header {
    display: flex; align-items: center; gap: 6px; padding: 8px 10px;
    border-radius: 6px; cursor: pointer; user-select: none;
    font-weight: 600; font-size: 13px; color: var(--ink);
  }
  .folder-header:hover { background: var(--bg3); }
  .folder-arrow { font-size: 10px; transition: transform 0.2s; color: var(--muted); width: 12px; }
  .folder-block.collapsed .folder-arrow { transform: rotate(-90deg); }
  .folder-name { flex: 1; }
  .folder-count { font-size: 11px; color: var(--muted); font-weight: 400; }
  .folder-actions { display: none; gap: 2px; }
  .folder-header:hover .folder-actions { display: flex; }
  .folder-actions button {
    background: none; border: none; cursor: pointer; padding: 2px 4px;
    border-radius: 3px; font-size: 12px; color: var(--muted);
  }
  .folder-actions button:hover { background: var(--rule); color: var(--ink); }

  .folder-clips { padding-left: 18px; display: flex; flex-direction: column; gap: 2px; }
  .folder-block.collapsed .folder-clips { display: none; }

  .clip-item {
    padding: 8px 10px; border-radius: 6px; cursor: pointer;
    border: 1px solid transparent; transition: background 0.15s;
    display: flex; flex-direction: column; gap: 2px;
  }
  .clip-item:hover { background: var(--bg3); }
  .clip-item.active { background: var(--accent-light); border-color: var(--accent); }
  .clip-item-name { font-size: 13px; font-weight: 500; }
  .clip-item-source { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 3px; }

  .uncategorized-title {
    padding: 8px 10px; font-size: 12px; color: var(--muted);
    font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;
  }

  .empty-state { text-align: center; color: var(--muted); padding: 30px 16px; font-size: 13px; }
  .toggle-left-btn {
    position: fixed; left: 0; top: 50%; transform: translateY(-50%);
    z-index: 90; background: var(--bg2); border: 1px solid var(--rule);
    border-left: none; border-radius: 0 8px 8px 0; padding: 12px 4px;
    cursor: pointer; font-size: 14px; color: var(--ink); box-shadow: var(--shadow);
    display: none;
  }

  /* 主内容区 */
  .main-content { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--bg); }
  .main-header {
    padding: 10px 16px; background: var(--bg2); border-bottom: 1px solid var(--rule);
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .main-title { font-size: 15px; font-weight: 700; }
  .main-title small { font-size: 12px; color: var(--muted); font-weight: 400; }
  .btn { cursor: pointer; border: none; border-radius: 6px; padding: 6px 12px; font-size: 13px; font-weight: 500; transition: 0.2s; display: inline-flex; align-items: center; gap: 4px; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { opacity: 0.9; }
  .btn-secondary { background: var(--bg3); color: var(--ink); }
  .btn-secondary:hover { background: var(--rule); }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-sm { padding: 4px 10px; font-size: 12px; }
  .clips-area { flex: 1; overflow-y: auto; padding: 16px; }
  .clips-container { max-width: 960px; margin: 0 auto; }

  /* 片段信息条 */
  .clip-info-bar {
    background: var(--bg2); border: 1px solid var(--rule); border-radius: 8px;
    padding: 12px 16px; margin-bottom: 16px; display: flex; flex-wrap: wrap; gap: 16px;
    box-shadow: var(--shadow);
  }
  .info-item { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 140px; }
  .info-label { font-size: 11px; color: var(--muted); font-weight: 600; }
  .info-value { font-size: 13px; color: var(--ink); }
  .info-value input {
    width: 100%; padding: 4px 8px; border: 1px solid var(--rule); border-radius: 4px;
    background: var(--bg); color: var(--ink); font-size: 13px; outline: none;
  }
  .info-value input:focus { border-color: var(--accent); }

  /* 镜头卡片 */
  .clip-card {
    background: var(--bg2); border: 1px solid var(--rule); border-radius: 10px;
    box-shadow: var(--shadow); overflow: hidden; margin-bottom: 16px;
  }
  .clip-card-header {
    padding: 10px 14px; border-bottom: 1px solid var(--rule);
    display: flex; align-items: center; justify-content: space-between;
    background: var(--bg3);
  }
  .clip-card-title { font-size: 14px; font-weight: 600; }
  .clip-card-body { padding: 14px; display: grid; grid-template-columns: 240px 1fr; gap: 16px; }
  .clip-screenshot { display: flex; flex-direction: column; gap: 8px; }
  .clip-img-wrap {
    width: 100%; aspect-ratio: 16/9; background: var(--bg3);
    border: 1px dashed var(--rule); border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; overflow: hidden; position: relative;
  }
  .clip-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
  .clip-img-wrap .placeholder { color: var(--muted); font-size: 12px; text-align: center; padding: 10px; }
  .clip-img-actions { display: flex; gap: 6px; }
  .clip-img-actions .btn { flex: 1; justify-content: center; }

  .clip-fields { display: flex; flex-direction: column; gap: 10px; }
  .field-row { display: flex; flex-direction: column; gap: 4px; }
  .field-label { font-size: 12px; font-weight: 600; color: var(--accent); }
  .field-input, .field-textarea {
    width: 100%; padding: 6px 10px; border: 1px solid var(--rule);
    border-radius: 4px; font-size: 13px; background: var(--bg); color: var(--ink);
    outline: none; font-family: inherit;
  }
  .field-input:focus, .field-textarea:focus { border-color: var(--accent); }
  .field-textarea { resize: vertical; min-height: 60px; line-height: 1.6; }
  .fields-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  /* 弹窗 */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 9998;
    display: none; align-items: center; justify-content: center;
  }
  .modal-overlay.show { display: flex; }
  .modal-box {
    background: var(--bg2); border-radius: 12px; padding: 20px;
    width: 90%; max-width: 420px; box-shadow: var(--shadow-lg);
  }
  .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; color: var(--accent); }
  .modal-field { margin-bottom: 12px; display: flex; flex-direction: column; gap: 4px; }
  .modal-field label { font-size: 12px; font-weight: 600; color: var(--muted); }
  .modal-field input, .modal-field select, .modal-field textarea {
    padding: 8px 10px; border: 1px solid var(--rule); border-radius: 6px;
    font-size: 13px; background: var(--bg); color: var(--ink); outline: none;
    font-family: inherit;
  }
  .modal-field input:focus, .modal-field select:focus, .modal-field textarea:focus { border-color: var(--accent); }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

  /* 灯箱 */
  .lightbox {
    position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 9999;
    display: none; align-items: center; justify-content: center; cursor: zoom-out;
  }
  .lightbox.show { display: flex; }
  .lightbox img { max-width: 92%; max-height: 92%; object-fit: contain; border-radius: 4px; }
  .lightbox-close {
    position: absolute; top: 16px; right: 20px; color: #fff;
    font-size: 32px; cursor: pointer; background: none; border: none; line-height: 1;
  }

  /* 保存提示 */
  .save-indicator {
    position: fixed; bottom: 16px; right: 16px; padding: 8px 16px;
    background: var(--success); color: #fff; border-radius: 6px;
    font-size: 12px; opacity: 0; transition: opacity 0.3s; z-index: 100;
    pointer-events: none;
  }
  .save-indicator.show { opacity: 1; }

  /* 右键菜单 */
  .context-menu {
    position: fixed; z-index: 10000; background: var(--bg2);
    border: 1px solid var(--rule); border-radius: 8px; box-shadow: var(--shadow-lg);
    padding: 4px; min-width: 140px; display: none;
  }
  .context-menu.show { display: block; }
  .context-menu-item {
    padding: 8px 12px; border-radius: 4px; cursor: pointer;
    font-size: 13px; display: flex; align-items: center; gap: 8px;
  }
  .context-menu-item:hover { background: var(--accent-light); }
  .context-menu-item.danger { color: var(--danger); }

  @media (max-width: 768px) {
    .clip-card-body { grid-template-columns: 1fr; }
    .fields-grid { grid-template-columns: 1fr; }
    .sidebar-left { position: fixed; z-index: 100; height: 100%; transform: translateX(-100%); transition: transform 0.3s; }
    .sidebar-left.open { transform: translateX(0); }
  }
</style>

    <div class="clip-tree" id="clipTree"><div class="empty-state">暂无片段<br><small>点击 ➕ 新建片段</small></div></div>
  </aside>
  <button class="toggle-left-btn" onclick="toggleLeftSidebar()">▶</button>

  <!-- 主内容区 -->
  <main class="main-content">
    <div class="main-header">
      <div class="main-title" id="mainTitle">片段拉片 <small>请选择左侧片段或新建片段</small></div>
    </div>
    <div class="clips-area">
      <div class="clips-container" id="clipsContainer"><div class="empty-state"><div style="font-size:40px;margin-bottom:12px;">🎞️</div><div>点击左侧 ➕ 新建片段，或选择已有片段开始拉片分析</div></div></div>
    </div>
  </main>
</div>

<!-- 新建片段弹窗 -->
<div class="modal-overlay" id="newClipModal">
  <div class="modal-box">
    <div class="modal-title">🎬 新建片段</div>
    <div class="modal-field">
      <label>片段名称 *</label>
      <input type="text" id="newClipName" placeholder="如：开场长镜头">
    </div>
    <div class="modal-field">
      <label>来源影片 *</label>
      <input type="text" id="newClipSource" placeholder="如：盗梦空间">
    </div>
    <div class="modal-field">
      <label>所属文件夹</label>
      <select id="newClipFolder">
        <option value="">未分类</option>
      </select>
    </div>
    <div class="modal-field">
      <label>片段时长</label>
      <input type="text" id="newClipDuration" placeholder="如 00:00:30">
    </div>
    <div class="modal-field">
      <label>原片位置</label>
      <input type="text" id="newClipPosition" placeholder="如 00:15:00">
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal('newClipModal')">取消</button>
      <button class="btn btn-primary" onclick="createClip()">创建</button>
    </div>
  </div>
</div>

<!-- 新建文件夹弹窗 -->
<div class="modal-overlay" id="newFolderModal">
  <div class="modal-box">
    <div class="modal-title">📁 新建文件夹</div>
    <div class="modal-field">
      <label>文件夹名称 *</label>
      <input type="text" id="newFolderName" placeholder="如：动作戏">
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal('newFolderModal')">取消</button>
      <button class="btn btn-primary" onclick="createFolder()">创建</button>
    </div>
  </div>
</div>

<!-- 重命名弹窗 -->
<div class="modal-overlay" id="renameModal">
  <div class="modal-box">
    <div class="modal-title" id="renameTitle">重命名</div>
    <div class="modal-field">
      <label>新名称</label>
      <input type="text" id="renameInput">
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal('renameModal')">取消</button>
      <button class="btn btn-primary" onclick="confirmRename()">确定</button>
    </div>
  </div>
</div>

<!-- 图片灯箱 -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox()">×</button>
  <img id="lightboxImg" src="" alt="">
</div>

<!-- 右键菜单 -->
<div class="context-menu" id="contextMenu"></div>

<div class="save-indicator" id="saveIndicator">✓ 已保存</div>

<script>
const LAPIAN_KEY = 'lapian_platform_v2';
const CLIP_KEY = 'lapian_clips_v2';

let clipData = { folders: [], clips: [] };
let currentClipId = null;
let renameTarget = null; // { type: 'folder'|'clip', id }
let contextTarget = null; // { type, id }
// 暴露到 window 便于调试与外部访问
Object.defineProperty(window, 'clipData', { get: () => clipData, set: v => { clipData = v; } });
Object.defineProperty(window, 'currentClipId', { get: () => currentClipId, set: v => { currentClipId = v; } });

// ============ 数据读写 ============
function loadClipData() {
  try {
    const raw = localStorage.getItem(CLIP_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      // 兼容旧版数据结构
      if (parsed.folders && Array.isArray(parsed.folders)) {
        clipData = parsed;
      } else {
        // 旧版 { [filmId]: { clipDuration, originalPosition, clips: [] } }
        clipData = { folders: [], clips: [] };
        for (const filmId in parsed) {
          const old = parsed[filmId];
          if (old && old.clips) {
            old.clips.forEach(c => {
              clipData.clips.push({
                id: c.id || generateId(),
                name: '未命名片段',
                sourceFilm: '',
                folderId: '',
                clipDuration: old.clipDuration || '',
                originalPosition: old.originalPosition || '',
                image: c.image || '',
                cameraMovement: c.cameraMovement || '',
                shotScale: c.shotScale || '',
                duration: c.duration || '',
                color: c.color || '',
                composition: c.composition || '',
                atmosphere: c.atmosphere || '',
                directorIntention: c.directorIntention || ''
              });
            });
          }
        }
        saveClipData();
      }
    }
  } catch(e) { console.error('读取片段数据失败', e); }
  if (!clipData.folders) clipData.folders = [];
  if (!clipData.clips) clipData.clips = [];
}

function saveClipData() {
  try {
    localStorage.setItem(CLIP_KEY, JSON.stringify(clipData));
    showSaved();
  } catch(e) {
    alert('保存失败，存储空间可能不足。请尝试删除一些截图。\n错误: ' + e.message);
  }
}

// ============ 左侧树渲染 ============
function renderTree() {
  const treeEl = document.getElementById('clipTree');
  if (clipData.clips.length === 0 && clipData.folders.length === 0) {
    treeEl.innerHTML = '<div class="empty-state">暂无片段<br><small>点击 ➕ 新建片段</small></div>';
    return;
  }

  let html = '';

  // 渲染文件夹
  clipData.folders.forEach(folder => {
    const folderClips = clipData.clips.filter(c => c.folderId === folder.id);
    html += `
      <div class="folder-block" id="folder_${folder.id}">
        <div class="folder-header" onclick="toggleFolder('${folder.id}')" oncontextmenu="showContextMenu(event,'folder','${folder.id}');return false;">
          <span class="folder-arrow">▼</span>
          <span>📁</span>
          <span class="folder-name">${escapeHtml(folder.name)}</span>
          <span class="folder-count">${folderClips.length}</span>
          <div class="folder-actions" onclick="event.stopPropagation()">
            <button onclick="renameItem('folder','${folder.id}')" title="重命名">✎</button>
            <button onclick="deleteFolder('${folder.id}')" title="删除">×</button>
          </div>
        </div>
        <div class="folder-clips">
          ${folderClips.map(c => renderClipItem(c)).join('')}
        </div>
      </div>
    `;
  });

  // 未分类片段
  const uncategorized = clipData.clips.filter(c => !c.folderId);
  if (uncategorized.length > 0) {
    html += `<div class="uncategorized-title">未分类 (${uncategorized.length})</div>`;
    html += uncategorized.map(c => renderClipItem(c)).join('');
  }

  treeEl.innerHTML = html;
}

function renderClipItem(clip) {
  const isActive = clip.id === currentClipId;
  return `
    <div class="clip-item ${isActive ? 'active' : ''}"
         onclick="selectClip('${clip.id}')"
         oncontextmenu="showContextMenu(event,'clip','${clip.id}');return false;">
      <div class="clip-item-name">🎞️ ${escapeHtml(clip.name || '未命名片段')}</div>
      <div class="clip-item-source">🎬 ${escapeHtml(clip.sourceFilm || '未标注')}</div>
    </div>
  `;
}

function toggleFolder(folderId) {
  const el = document.getElementById('folder_' + folderId);
  if (el) el.classList.toggle('collapsed');
}

// ============ 片段操作 ============
function selectClip(clipId) {
  currentClipId = clipId;
  const clip = clipData.clips.find(c => c.id === clipId);
  if (clip) {
    document.getElementById('mainTitle').innerHTML = `片段拉片 <small>${escapeHtml(clip.sourceFilm || '')} · ${escapeHtml(clip.name || '')}</small>`;
  }
  renderTree();
  renderClipDetail();
}

function openNewClipModal() {
  // 填充文件夹选项
  const sel = document.getElementById('newClipFolder');
  sel.innerHTML = '<option value="">未分类</option>' +
    clipData.folders.map(f => `<option value="${f.id}">${escapeHtml(f.name)}</option>`).join('');
  document.getElementById('newClipName').value = '';
  document.getElementById('newClipSource').value = '';
  document.getElementById('newClipDuration').value = '';
  document.getElementById('newClipPosition').value = '';
  document.getElementById('newClipModal').classList.add('show');
  setTimeout(() => document.getElementById('newClipName').focus(), 50);
}

function createClip() {
  const name = document.getElementById('newClipName').value.trim();
  const source = document.getElementById('newClipSource').value.trim();
  if (!name) { alert('请输入片段名称'); return; }
  if (!source) { alert('请输入来源影片'); return; }

  const folderId = document.getElementById('newClipFolder').value;
  const duration = document.getElementById('newClipDuration').value.trim();
  const position = document.getElementById('newClipPosition').value.trim();

  const clip = {
    id: generateId(),
    name, sourceFilm: source, folderId,
    clipDuration: duration, originalPosition: position,
    image: '', cameraMovement: '', shotScale: '', duration: '',
    color: '', composition: '', atmosphere: '', directorIntention: ''
  };
  clipData.clips.push(clip);
  saveClipData();
  closeModal('newClipModal');
  currentClipId = clip.id;
  renderTree();
  selectClip(clip.id);
}

function deleteClip(clipId) {
  if (!confirm('确定删除此片段？所有分析内容将被清除。')) return;
  clipData.clips = clipData.clips.filter(c => c.id !== clipId);
  if (currentClipId === clipId) currentClipId = null;
  saveClipData();
  renderTree();
  renderClipDetail();
}

function updateClipField(clipId, field, value) {
  const clip = clipData.clips.find(c => c.id === clipId);
  if (clip) {
    clip[field] = value;
    saveClipData();
  }
}

// ============ 文件夹操作 ============
function openNewFolderModal() {
  document.getElementById('newFolderName').value = '';
  document.getElementById('newFolderModal').classList.add('show');
  setTimeout(() => document.getElementById('newFolderName').focus(), 50);
}

function createFolder() {
  const name = document.getElementById('newFolderName').value.trim();
  if (!name) { alert('请输入文件夹名称'); return; }
  clipData.folders.push({ id: generateId(), name });
  saveClipData();
  closeModal('newFolderModal');
  renderTree();
}

function deleteFolder(folderId) {
  const folder = clipData.folders.find(f => f.id === folderId);
  const count = clipData.clips.filter(c => c.folderId === folderId).length;
  const msg = count > 0
    ? `文件夹"${folder?.name}"中有 ${count} 个片段，删除后这些片段将变为未分类。确定删除？`
    : `确定删除文件夹"${folder?.name}"？`;
  if (!confirm(msg)) return;
  clipData.folders = clipData.folders.filter(f => f.id !== folderId);
  clipData.clips.forEach(c => { if (c.folderId === folderId) c.folderId = ''; });
  saveClipData();
  renderTree();
}

// ============ 重命名 ============
function renameItem(type, id) {
  renameTarget = { type, id };
  const title = document.getElementById('renameTitle');
  const input = document.getElementById('renameInput');
  if (type === 'folder') {
    const f = clipData.folders.find(x => x.id === id);
    title.textContent = '重命名文件夹';
    input.value = f ? f.name : '';
  } else {
    const c = clipData.clips.find(x => x.id === id);
    title.textContent = '重命名片段';
    input.value = c ? c.name : '';
  }
  document.getElementById('renameModal').classList.add('show');
  setTimeout(() => { input.focus(); input.select(); }, 50);
}

function confirmRename() {
  const val = document.getElementById('renameInput').value.trim();
  if (!val || !renameTarget) return;
  if (renameTarget.type === 'folder') {
    const f = clipData.folders.find(x => x.id === renameTarget.id);
    if (f) f.name = val;
  } else {
    const c = clipData.clips.find(x => x.id === renameTarget.id);
    if (c) c.name = val;
  }
  saveClipData();
  closeModal('renameModal');
  renderTree();
  if (renameTarget.type === 'clip' && currentClipId === renameTarget.id) {
    renderClipDetail();
  }
  renameTarget = null;
}

// ============ 右键菜单 ============
function showContextMenu(e, type, id) {
  contextTarget = { type, id };
  const menu = document.getElementById('contextMenu');
  let items = '';
  if (type === 'clip') {
    items = `
      <div class="context-menu-item" onclick="renameItem('clip','${id}');hideContextMenu()">✎ 重命名</div>
      <div class="context-menu-item" onclick="moveClipToFolder('${id}');hideContextMenu()">📁 移动到文件夹</div>
      <div class="context-menu-item danger" onclick="deleteClip('${id}');hideContextMenu()">🗑 删除片段</div>
    `;
  } else {
    items = `
      <div class="context-menu-item" onclick="renameItem('folder','${id}');hideContextMenu()">✎ 重命名</div>
      <div class="context-menu-item danger" onclick="deleteFolder('${id}');hideContextMenu()">🗑 删除文件夹</div>
    `;
  }
  menu.innerHTML = items;
  menu.style.left = Math.min(e.clientX, window.innerWidth - 160) + 'px';
  menu.style.top = Math.min(e.clientY, window.innerHeight - 120) + 'px';
  menu.classList.add('show');
}

function hideContextMenu() {
  document.getElementById('contextMenu').classList.remove('show');
  contextTarget = null;
}

function moveClipToFolder(clipId) {
  const clip = clipData.clips.find(c => c.id === clipId);
  if (!clip) return;
  const options = ['未分类'].concat(clipData.folders.map(f => f.name));
  const currentIdx = clip.folderId ? clipData.folders.findIndex(f => f.id === clip.folderId) + 1 : 0;
  const choice = prompt('选择目标文件夹：\n' + options.map((o, i) => `${i}. ${o}`).join('\n'), currentIdx);
  if (choice === null) return;
  const idx = parseInt(choice);
  if (isNaN(idx) || idx < 0 || idx >= options.length) { alert('无效选择'); return; }
  clip.folderId = idx === 0 ? '' : clipData.folders[idx - 1].id;
  saveClipData();
  renderTree();
}

document.addEventListener('click', hideContextMenu);

// ============ 片段详情 ============
function renderClipDetail() {
  const container = document.getElementById('clipsContainer');
  if (!currentClipId) {
    container.innerHTML = '<div class="empty-state"><div style="font-size:40px;margin-bottom:12px;">🎞️</div><div>点击左侧 ➕ 新建片段，或选择已有片段开始拉片分析</div></div>';
    return;
  }
  const clip = clipData.clips.find(c => c.id === currentClipId);
  if (!clip) {
    container.innerHTML = '<div class="empty-state">片段不存在</div>';
    return;
  }

  container.innerHTML = `
    <div class="clip-info-bar">
      <div class="info-item">
        <span class="info-label">片段名称</span>
        <span class="info-value"><input value="${escapeHtml(clip.name)}" oninput="updateClipField('${clip.id}','name',this.value);updateTitle()"></span>
      </div>
      <div class="info-item">
        <span class="info-label">来源影片</span>
        <span class="info-value"><input value="${escapeHtml(clip.sourceFilm)}" oninput="updateClipField('${clip.id}','sourceFilm',this.value);updateTitle()"></span>
      </div>
      <div class="info-item">
        <span class="info-label">片段时长</span>
        <span class="info-value"><input value="${escapeHtml(clip.clipDuration)}" oninput="updateClipField('${clip.id}','clipDuration',this.value)"></span>
      </div>
      <div class="info-item">
        <span class="info-label">原片位置</span>
        <span class="info-value"><input value="${escapeHtml(clip.originalPosition)}" oninput="updateClipField('${clip.id}','originalPosition',this.value)"></span>
      </div>
      <div class="info-item" style="flex:0 0 auto;">
        <span class="info-label">操作</span>
        <span class="info-value"><button class="btn btn-danger btn-sm" onclick="deleteClip('${clip.id}')">🗑 删除片段</button></span>
      </div>
    </div>

    <div class="clip-card">
      <div class="clip-card-header">
        <span class="clip-card-title">镜头分析</span>
      </div>
      <div class="clip-card-body">
        <div class="clip-screenshot">
          <div class="clip-img-wrap" onclick="${clip.image ? `openLightbox('${clip.image}')` : `document.getElementById('upload_${clip.id}').click()`}">
            ${clip.image
              ? `<img src="${clip.image}" alt="截图">`
              : `<div class="placeholder">📷 点击上传截图<br><small>（自动压缩）</small></div>`}
          </div>
          <input type="file" id="upload_${clip.id}" accept="image/*" style="display:none" onchange="handleImageUpload(event, '${clip.id}')">
          <div class="clip-img-actions">
            <button class="btn btn-secondary btn-sm" onclick="document.getElementById('upload_${clip.id}').click()">📷 上传</button>
            ${clip.image ? `<button class="btn btn-secondary btn-sm" onclick="clearClipImage('${clip.id}')">🗑 移除</button>` : ''}
          </div>
        </div>
        <div class="clip-fields">
          <div class="fields-grid">
            <div class="field-row">
              <label class="field-label">运镜</label>
              <input class="field-input" placeholder="如 推/拉/摇/移/跟" value="${escapeHtml(clip.cameraMovement)}"
                     oninput="updateClipField('${clip.id}','cameraMovement',this.value)">
            </div>
            <div class="field-row">
              <label class="field-label">景别</label>
              <input class="field-input" placeholder="如 特写/近景/中景/全景" value="${escapeHtml(clip.shotScale)}"
                     oninput="updateClipField('${clip.id}','shotScale',this.value)">
            </div>
            <div class="field-row">
              <label class="field-label">持续时长</label>
              <input class="field-input" placeholder="如 3.5秒" value="${escapeHtml(clip.duration)}"
                     oninput="updateClipField('${clip.id}','duration',this.value)">
            </div>
            <div class="field-row">
              <label class="field-label">色彩</label>
              <input class="field-input" placeholder="如 冷色调/暖色调/高对比" value="${escapeHtml(clip.color)}"
                     oninput="updateClipField('${clip.id}','color',this.value)">
            </div>
            <div class="field-row">
              <label class="field-label">构图</label>
              <input class="field-input" placeholder="如 三分法/对称/框架" value="${escapeHtml(clip.composition)}"
                     oninput="updateClipField('${clip.id}','composition',this.value)">
            </div>
            <div class="field-row">
              <label class="field-label">气氛</label>
              <input class="field-input" placeholder="如 紧张/压抑/温馨" value="${escapeHtml(clip.atmosphere)}"
                     oninput="updateClipField('${clip.id}','atmosphere',this.value)">
            </div>
          </div>
          <div class="field-row">
            <label class="field-label">导演意图</label>
            <textarea class="field-textarea" placeholder="分析导演在此镜头中的表达意图..."
                      oninput="updateClipField('${clip.id}','directorIntention',this.value)">${escapeHtml(clip.directorIntention)}</textarea>
          </div>
        </div>
      </div>
    </div>
  `;
}

function updateTitle() {
  if (!currentClipId) return;
  const clip = clipData.clips.find(c => c.id === currentClipId);
  if (clip) {
    document.getElementById('mainTitle').innerHTML = `片段拉片 <small>${escapeHtml(clip.sourceFilm || '')} · ${escapeHtml(clip.name || '')}</small>`;
  }
}

// ============ 图片处理（最省内存：缩放+JPEG压缩） ============
function handleImageUpload(event, clipId) {
  const file = event.target.files[0];
  if (!file) return;
  if (!file.type.startsWith('image/')) { alert('请选择图片文件'); return; }
  if (file.size > 10 * 1024 * 1024) { alert('图片过大（超过10MB），请选择较小的图片'); return; }

  const reader = new FileReader();
  reader.onload = function(e) {
    const img = new Image();
    img.onload = function() {
      const MAX_W = 800;
      let w = img.width, h = img.height;
      if (w > MAX_W) {
        h = Math.round(h * MAX_W / w);
        w = MAX_W;
      }
      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
      updateClipField(clipId, 'image', dataUrl);
      renderClipDetail();
    };
    img.onerror = function() { alert('图片加载失败'); };
    img.src = e.target.result;
  };
  reader.onerror = function() { alert('文件读取失败'); };
  reader.readAsDataURL(file);
  event.target.value = '';
}

function clearClipImage(clipId) {
  updateClipField(clipId, 'image', '');
  renderClipDetail();
}

// ============ 灯箱 ============
function openLightbox(src) {
  document.getElementById('lightboxImg').src = src;
  document.getElementById('lightbox').classList.add('show');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('show');
}

// ============ 弹窗 ============
function closeModal(id) {
  document.getElementById(id).classList.remove('show');
}
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', function(e) {
    if (e.target === this) this.classList.remove('show');
  });
});

// ============ 工具 ============
function generateId() {
  return Date.now().toString(36) + Math.random().toString(36).substr(2, 9);
}
function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s == null ? '' : String(s);
  return d.innerHTML;
}
function toggleLeftSidebar() {
  document.getElementById('sidebarLeft').classList.toggle('collapsed');
}
let saveTimer = null;
function showSaved() {
  const el = document.getElementById('saveIndicator');
  el.classList.add('show');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => el.classList.remove('show'), 1200);
}

// ============ 主题同步 ============
function applyTheme() {
  const mode = localStorage.getItem('xfy_theme_mode') || 'light';
  document.documentElement.setAttribute('data-theme', mode);
}
window.addEventListener('message', function(e) {
  if (e.data && e.data.type === 'theme') {
    if (e.data.mode) localStorage.setItem('xfy_theme_mode', e.data.mode);
    applyTheme();
  }
});

// ============ 启动 ============
applyTheme();
loadClipData();
renderTree();
renderClipDetail();
